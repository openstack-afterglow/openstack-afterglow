      OS_USERNAME: ${PALIMPSEST_OS_USERNAME:-palimpsest}
      OS_PASSWORD: ${PALIMPSEST_OS_PASSWORD:-}
      OS_PROJECT_NAME: ${PALIMPSEST_OS_PROJECT_NAME:-palimpsest-service}
      OS_PROJECT_DOMAIN_NAME: ${PALIMPSEST_OS_PROJECT_DOMAIN_NAME:-Default}
      OS_USER_DOMAIN_NAME: ${PALIMPSEST_OS_USER_DOMAIN_NAME:-Default}
      OS_REGION_NAME: ${PALIMPSEST_OS_REGION_NAME:-RegionOne}
      OS_INTERFACE: ${PALIMPSEST_OS_INTERFACE:-internal}
      SSL_VERIFY: ${PALIMPSEST_SSL_VERIFY:-true}
    volumes:
      - palimpsest-hub:/var/lib/palimpsest/hub
    depends_on:
      redis:
        condition: service_started
      palimpsest-bootstrap:
        condition: service_completed_successfully
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8020/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  palimpsest-worker:
    profiles: ["palimpsest"]
    image: ${PALIMPSEST_WORKER_IMAGE:-${REGISTRY:-ghcr.io/openstack-afterglow}/palimpsest-hub-worker:${PALIMPSEST_IMAGE_TAG:-${IMAGE_TAG:-latest}}}
    pull_policy: always
    environment:
      DATABASE_URL: ${PALIMPSEST_DATABASE_URL:-}
      REDIS_URL: redis://redis:6379/9
      PALIMPSEST_HUB_LOCAL_PATH: /var/lib/palimpsest/hub
      OS_AUTH_URL: ${PALIMPSEST_OS_AUTH_URL:-}
      OS_USERNAME: ${PALIMPSEST_OS_USERNAME:-palimpsest}
      OS_PASSWORD: ${PALIMPSEST_OS_PASSWORD:-}
      OS_PROJECT_NAME: ${PALIMPSEST_OS_PROJECT_NAME:-palimpsest-service}
      OS_PROJECT_DOMAIN_NAME: ${PALIMPSEST_OS_PROJECT_DOMAIN_NAME:-Default}
      OS_USER_DOMAIN_NAME: ${PALIMPSEST_OS_USER_DOMAIN_NAME:-Default}
      OS_REGION_NAME: ${PALIMPSEST_OS_REGION_NAME:-RegionOne}
      OS_INTERFACE: ${PALIMPSEST_OS_INTERFACE:-internal}
      SSL_VERIFY: ${PALIMPSEST_SSL_VERIFY:-true}
    volumes:
      - palimpsest-hub:/var/lib/palimpsest/hub
    depends_on:
      redis:
        condition: service_started
      palimpsest-bootstrap:
        condition: service_completed_successfully
    restart: always

volumes:
  redis-data:
  palimpsest-hub:
