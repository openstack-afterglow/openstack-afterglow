# Image-only production stack. The operator supplies production configuration and
# secrets outside this repository; this file never builds application images.
#
# Required for the default stack: SECRET_KEY, OS_PASSWORD, DATABASE_URL, ORIGIN,
# PUBLIC_API_BASE, and TLS_CERTS_DIR. TLS_CERTS_DIR must contain PEM files with
# each certificate chain and its private key. Full *_IMAGE overrides support tags/digests.
name: afterglow-production

services:
  redis:
    image: redis:7-alpine
    pull_policy: always
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: ${AFTERGLOW_BACKEND_IMAGE:-${REGISTRY:-ghcr.io/openstack-afterglow}/afterglow-api:${BACKEND_IMAGE_TAG:-${IMAGE_TAG:-latest}}}
    pull_policy: always
    volumes:
      - ./afterglow.conf:/app/afterglow.conf:ro
      - ./logs:/app/logs
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --proxy-headers
    environment:
      OS_PASSWORD: ${OS_PASSWORD:?OS_PASSWORD must be set}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      AFTERGLOW_ENV: production
      AFTERGLOW_ALLOW_INSECURE: "0"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must select the production Afterglow database}
      REDIS_URL: redis://redis:6379/0
      SENTINEL_ENABLED: "false"
      SENTINEL_HOSTS: ""
      FRONTEND_BASE_URL: ${ORIGIN:?ORIGIN must be an HTTPS public origin}
      PUBLIC_API_BASE: ${PUBLIC_API_BASE:?PUBLIC_API_BASE must be an HTTPS public API origin}
      CORS_ORIGINS: ${ORIGIN:?ORIGIN must be an HTTPS public origin}
      # No application host ports: only the private Compose network reaches Uvicorn.
      FORWARDED_ALLOW_IPS: "*"
      LUMEN_MCP_SERVICE_TOKEN: ${LUMEN_MCP_SERVICE_TOKEN:-}
      SERVICE_WAYGATE_INTERNAL_URL:
      SERVICE_DROVER_INTERNAL_URL:
      SERVICE_LUMEN_INTERNAL_URL:
      SERVICE_PALIMPSEST_INTERNAL_URL:
    depends_on:
      - redis
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  frontend:
    image: ${AFTERGLOW_FRONTEND_IMAGE:-${REGISTRY:-ghcr.io/openstack-afterglow}/afterglow:${FRONTEND_IMAGE_TAG:-${IMAGE_TAG:-latest}}}
    pull_policy: always
    volumes:
      - ./logs:/app/logs
    environment:
      ORIGIN: ${ORIGIN:?ORIGIN must be an HTTPS public origin}
      PUBLIC_API_BASE: ${PUBLIC_API_BASE:?PUBLIC_API_BASE must be an HTTPS public API origin}
      PUBLIC_S3_BASE: ${PUBLIC_S3_BASE:-}
      PUBLIC_GRAFANA_BASE: ${PUBLIC_GRAFANA_BASE:-}
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3080/health',{redirect:'error'}).then(async r=>{if(!r.ok||(await r.json()).status!=='ok')throw 1})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  haproxy:
    image: haproxy:3.2-alpine
    pull_policy: always
    ports:
      - "80:80"
      - "443:443"
      # Keystone catalog ingress for optional sibling APIs. These listeners are
      # HAProxy only; application containers never publish host ports.
      - "8010:8010"
      - "8011:8011"
      - "8012:8012"
      - "8020:8020"
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ${TLS_CERTS_DIR:?TLS_CERTS_DIR must be an absolute directory of PEM certificate-and-key files}:/etc/haproxy/certs:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  notion-worker:
    profiles: ["notion"]
    image: ${AFTERGLOW_WORKER_IMAGE:-${REGISTRY:-ghcr.io/openstack-afterglow}/afterglow-worker:${WORKER_IMAGE_TAG:-${IMAGE_TAG:-latest}}}
    pull_policy: always
    command: python -m app.notion_worker
    volumes:
      - ./afterglow.conf:/app/afterglow.conf:ro
      - ./logs:/app/logs
    environment:
      OS_PASSWORD: ${OS_PASSWORD:?OS_PASSWORD must be set}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      AFTERGLOW_ENV: production
      AFTERGLOW_ALLOW_INSECURE: "0"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must select the production Afterglow database}
      REDIS_URL: redis://redis:6379/0
      SENTINEL_ENABLED: "false"
      SENTINEL_HOSTS: ""
      SERVICE_WAYGATE_INTERNAL_URL:
      SERVICE_DROVER_INTERNAL_URL:
      SERVICE_LUMEN_INTERNAL_URL:
      SERVICE_PALIMPSEST_INTERNAL_URL:
    depends_on:
      - redis
      - backend
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  waygate-migrate:
    profiles: ["waygate"]
    image: ${WAYGATE_API_IMAGE:-${REGISTRY:-ghcr.io/openstack-afterglow}/waygate-api:${WAYGATE_IMAGE_TAG:-${IMAGE_TAG:-latest}}}
    pull_policy: always
    command: python -m waygate.scripts.migrate --apply
    environment:
      DATABASE_URL: ${WAYGATE_DATABASE_URL:-}
      REDIS_URL: redis://redis:6379/6
      OS_AUTH_URL: ${WAYGATE_OS_AUTH_URL:-}
      OS_USERNAME: ${WAYGATE_OS_USERNAME:-waygate}
      OS_PASSWORD: ${WAYGATE_OS_PASSWORD:-}
      OS_PROJECT_NAME: ${WAYGATE_OS_PROJECT_NAME:-waygate}
      OS_PROJECT_DOMAIN_NAME: ${WAYGATE_OS_PROJECT_DOMAIN_NAME:-Default}
      OS_USER_DOMAIN_NAME: ${WAYGATE_OS_USER_DOMAIN_NAME:-Default}
      OS_REGION_NAME: ${WAYGATE_OS_REGION_NAME:-RegionOne}
      OS_INTERFACE: ${WAYGATE_OS_INTERFACE:-internal}
      WAYGATE_CALLBACK_BASE_URL: ${WAYGATE_CALLBACK_BASE_URL:-}
      WAYGATE_KEY_NAME: ${WAYGATE_KEY_NAME:-}
      WAYGATE_ENCRYPTION_KEY: ${WAYGATE_ENCRYPTION_KEY:-}
    depends_on:
      - redis
    restart: "no"

  waygate-api:
    profiles: ["waygate"]
    image: ${WAYGATE_API_IMAGE:-${REGISTRY:-ghcr.io/openstack-afterglow}/waygate-api:${WAYGATE_IMAGE_TAG:-${IMAGE_TAG:-latest}}}
    pull_policy: always
    environment:
      DATABASE_URL: ${WAYGATE_DATABASE_URL:-}
      REDIS_URL: redis://redis:6379/6
      OS_AUTH_URL: ${WAYGATE_OS_AUTH_URL:-}
      OS_USERNAME: ${WAYGATE_OS_USERNAME:-waygate}
      OS_PASSWORD: ${WAYGATE_OS_PASSWORD:-}
      OS_PROJECT_NAME: ${WAYGATE_OS_PROJECT_NAME:-waygate}
      OS_PROJECT_DOMAIN_NAME: ${WAYGATE_OS_PROJECT_DOMAIN_NAME:-Default}
      OS_USER_DOMAIN_NAME: ${WAYGATE_OS_USER_DOMAIN_NAME:-Default}
      OS_REGION_NAME: ${WAYGATE_OS_REGION_NAME:-RegionOne}
      OS_INTERFACE: ${WAYGATE_OS_INTERFACE:-internal}
      WAYGATE_CALLBACK_BASE_URL: ${WAYGATE_CALLBACK_BASE_URL:-}
      WAYGATE_KEY_NAME: ${WAYGATE_KEY_NAME:-}
      WAYGATE_ENCRYPTION_KEY: ${WAYGATE_ENCRYPTION_KEY:-}
    depends_on:
      redis:
        condition: service_started
      waygate-migrate:
        condition: service_completed_successfully
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  waygate-worker:
    profiles: ["waygate"]
    image: ${WAYGATE_WORKER_IMAGE:-${REGISTRY:-ghcr.io/openstack-afterglow}/waygate-worker:${WAYGATE_IMAGE_TAG:-${IMAGE_TAG:-latest}}}
    pull_policy: always
    environment:
      DATABASE_URL: ${WAYGATE_DATABASE_URL:-}
      REDIS_URL: redis://redis:6379/6
      OS_AUTH_URL: ${WAYGATE_OS_AUTH_URL:-}
      OS_USERNAME: ${WAYGATE_OS_USERNAME:-waygate}
      OS_PASSWORD: ${WAYGATE_OS_PASSWORD:-}
      OS_PROJECT_NAME: ${WAYGATE_OS_PROJECT_NAME:-waygate}
      OS_PROJECT_DOMAIN_NAME: ${WAYGATE_OS_PROJECT_DOMAIN_NAME:-Default}
      OS_USER_DOMAIN_NAME: ${WAYGATE_OS_USER_DOMAIN_NAME:-Default}
      OS_REGION_NAME: ${WAYGATE_OS_REGION_NAME:-RegionOne}
      OS_INTERFACE: ${WAYGATE_OS_INTERFACE:-internal}
      WAYGATE_CALLBACK_BASE_URL: ${WAYGATE_CALLBACK_BASE_URL:-}
      WAYGATE_KEY_NAME: ${WAYGATE_KEY_NAME:-}
      WAYGATE_ENCRYPTION_KEY: ${WAYGATE_ENCRYPTION_KEY:-}
    depends_on:
      redis:
        condition: service_started
      waygate-migrate:
        condition: service_completed_successfully
    restart: always

  drover-migrate:
    profiles: ["drover"]
    image: ${DROVER_API_IMAGE:-${REGISTRY:-ghcr.io/openstack-afterglow}/drover-api:${DROVER_IMAGE_TAG:-${IMAGE_TAG:-latest}}}
    pull_policy: always
    command: python -m drover.scripts.migrate --apply
    environment:
      DATABASE_URL: ${DROVER_DATABASE_URL:-}
      REDIS_URL: redis://redis:6379/7
      OS_AUTH_URL: ${DROVER_OS_AUTH_URL:-}
      OS_USERNAME: ${DROVER_OS_USERNAME:-drover}
      OS_PASSWORD: ${DROVER_OS_PASSWORD:-}
      OS_PROJECT_NAME: ${DROVER_OS_PROJECT_NAME:-drover-service}
      OS_SERVICE_PROJECT_ID: ${DROVER_OS_SERVICE_PROJECT_ID:-}
      OS_PROJECT_DOMAIN_NAME: ${DROVER_OS_PROJECT_DOMAIN_NAME:-Default}
      OS_USER_DOMAIN_NAME: ${DROVER_OS_USER_DOMAIN_NAME:-Default}
      OS_REGION_NAME: ${DROVER_OS_REGION_NAME:-RegionOne}
      OS_INTERFACE: ${DROVER_OS_INTERFACE:-internal}
      DROVER_CALLBACK_BASE_URL: ${DROVER_CALLBACK_BASE_URL:-}
      DROVER_KUBECONFIG_ENCRYPTION_KEY: ${DROVER_KUBECONFIG_ENCRYPTION_KEY:-}
    depends_on:
      - redis
    restart: "no"

  drover-api:
    profiles: ["drover"]
    image: ${DROVER_API_IMAGE:-${REGISTRY:-ghcr.io/openstack-afterglow}/drover-api:${DROVER_IMAGE_TAG:-${IMAGE_TAG:-latest}}}
    pull_policy: always
    environment:
      DATABASE_URL: ${DROVER_DATABASE_URL:-}
      REDIS_URL: redis://redis:6379/7
      OS_AUTH_URL: ${DROVER_OS_AUTH_URL:-}
      OS_USERNAME: ${DROVER_OS_USERNAME:-drover}
      OS_PASSWORD: ${DROVER_OS_PASSWORD:-}
      OS_PROJECT_NAME: ${DROVER_OS_PROJECT_NAME:-drover-service}
      OS_SERVICE_PROJECT_ID: ${DROVER_OS_SERVICE_PROJECT_ID:-}
      OS_PROJECT_DOMAIN_NAME: ${DROVER_OS_PROJECT_DOMAIN_NAME:-Default}
      OS_USER_DOMAIN_NAME: ${DROVER_OS_USER_DOMAIN_NAME:-Default}
      OS_REGION_NAME: ${DROVER_OS_REGION_NAME:-RegionOne}
      OS_INTERFACE: ${DROVER_OS_INTERFACE:-internal}
      DROVER_CALLBACK_BASE_URL: ${DROVER_CALLBACK_BASE_URL:-}
      DROVER_KUBECONFIG_ENCRYPTION_KEY: ${DROVER_KUBECONFIG_ENCRYPTION_KEY:-}
    depends_on:
      redis:
        condition: service_started
      drover-migrate:
        condition: service_completed_successfully
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8011/v1/health/ready')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  drover-worker:
    profiles: ["drover"]
    image: ${DROVER_WORKER_IMAGE:-${REGISTRY:-ghcr.io/openstack-afterglow}/drover-worker:${DROVER_IMAGE_TAG:-${IMAGE_TAG:-latest}}}
    pull_policy: always
    environment:
      DATABASE_URL: ${DROVER_DATABASE_URL:-}
      REDIS_URL: redis://redis:6379/7
      OS_AUTH_URL: ${DROVER_OS_AUTH_URL:-}
      OS_USERNAME: ${DROVER_OS_USERNAME:-drover}
      OS_PASSWORD: ${DROVER_OS_PASSWORD:-}
      OS_PROJECT_NAME: ${DROVER_OS_PROJECT_NAME:-drover-service}
      OS_SERVICE_PROJECT_ID: ${DROVER_OS_SERVICE_PROJECT_ID:-}
      OS_PROJECT_DOMAIN_NAME: ${DROVER_OS_PROJECT_DOMAIN_NAME:-Default}
      OS_USER_DOMAIN_NAME: ${DROVER_OS_USER_DOMAIN_NAME:-Default}
      OS_REGION_NAME: ${DROVER_OS_REGION_NAME:-RegionOne}
      OS_INTERFACE: ${DROVER_OS_INTERFACE:-internal}
      DROVER_CALLBACK_BASE_URL: ${DROVER_CALLBACK_BASE_URL:-}
      DROVER_KUBECONFIG_ENCRYPTION_KEY: ${DROVER_KUBECONFIG_ENCRYPTION_KEY:-}
    depends_on:
      redis:
        condition: service_started
      drover-migrate:
        condition: service_completed_successfully
    restart: always

  lumen-migrate:
    profiles: ["lumen"]
    image: ${LUMEN_API_IMAGE:-${REGISTRY:-ghcr.io/openstack-afterglow}/lumen-api:${LUMEN_IMAGE_TAG:-${IMAGE_TAG:-latest}}}
    pull_policy: always
    command: python -m lumen.scripts.migrate --apply
    environment:
      DATABASE_URL: ${LUMEN_DATABASE_URL:-}
      REDIS_URL: redis://redis:6379/8
      CHAT_CHECKPOINTER_POSTGRES_URL: ${LUMEN_CHECKPOINTER_POSTGRES_URL:-}
      CHAT_MEMORY_PGVECTOR_URL: ${LUMEN_MEMORY_PGVECTOR_URL:-}
      KEYSTONE_AUTH_URL: ${LUMEN_KEYSTONE_AUTH_URL:-}
      KEYSTONE_ADMIN_USERNAME: ${LUMEN_KEYSTONE_ADMIN_USERNAME:-lumen}
      KEYSTONE_ADMIN_PASSWORD: ${LUMEN_KEYSTONE_ADMIN_PASSWORD:-}
      KEYSTONE_ADMIN_PROJECT: ${LUMEN_KEYSTONE_ADMIN_PROJECT:-lumen-service}
      KEYSTONE_DOMAIN: ${LUMEN_KEYSTONE_DOMAIN:-Default}
      KEYSTONE_REGION_NAME: ${LUMEN_KEYSTONE_REGION_NAME:-RegionOne}
      KEYSTONE_INTERFACE: ${LUMEN_KEYSTONE_INTERFACE:-internal}
      LUMEN_ENCRYPTION_KEY: ${LUMEN_ENCRYPTION_KEY:-}
      # Must be the operator-published OpenStack catalog endpoint, never backend DNS.
      MCP_CONTROL_PLANE_URL: ${LUMEN_MCP_CONTROL_PLANE_URL:-}
      LUMEN_MCP_SERVICE_TOKEN: ${LUMEN_MCP_SERVICE_TOKEN:-}
    depends_on:
      - redis
    restart: "no"

  lumen-api:
    profiles: ["lumen"]
    image: ${LUMEN_API_IMAGE:-${REGISTRY:-ghcr.io/openstack-afterglow}/lumen-api:${LUMEN_IMAGE_TAG:-${IMAGE_TAG:-latest}}}
    pull_policy: always
    environment:
      DATABASE_URL: ${LUMEN_DATABASE_URL:-}
      REDIS_URL: redis://redis:6379/8
      CHAT_CHECKPOINTER_POSTGRES_URL: ${LUMEN_CHECKPOINTER_POSTGRES_URL:-}
      CHAT_MEMORY_PGVECTOR_URL: ${LUMEN_MEMORY_PGVECTOR_URL:-}
      KEYSTONE_AUTH_URL: ${LUMEN_KEYSTONE_AUTH_URL:-}
      KEYSTONE_ADMIN_USERNAME: ${LUMEN_KEYSTONE_ADMIN_USERNAME:-lumen}
      KEYSTONE_ADMIN_PASSWORD: ${LUMEN_KEYSTONE_ADMIN_PASSWORD:-}
      KEYSTONE_ADMIN_PROJECT: ${LUMEN_KEYSTONE_ADMIN_PROJECT:-lumen-service}
      KEYSTONE_DOMAIN: ${LUMEN_KEYSTONE_DOMAIN:-Default}
      KEYSTONE_REGION_NAME: ${LUMEN_KEYSTONE_REGION_NAME:-RegionOne}
      KEYSTONE_INTERFACE: ${LUMEN_KEYSTONE_INTERFACE:-internal}
      LUMEN_ENCRYPTION_KEY: ${LUMEN_ENCRYPTION_KEY:-}
      MCP_CONTROL_PLANE_URL: ${LUMEN_MCP_CONTROL_PLANE_URL:-}
      LUMEN_MCP_SERVICE_TOKEN: ${LUMEN_MCP_SERVICE_TOKEN:-}
    depends_on:
      redis:
        condition: service_started
      lumen-migrate:
        condition: service_completed_successfully
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8012/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  lumen-worker:
    profiles: ["lumen"]
    image: ${LUMEN_WORKER_IMAGE:-${REGISTRY:-ghcr.io/openstack-afterglow}/lumen-worker:${LUMEN_IMAGE_TAG:-${IMAGE_TAG:-latest}}}
    pull_policy: always
    environment:
      DATABASE_URL: ${LUMEN_DATABASE_URL:-}
      REDIS_URL: redis://redis:6379/8
      CHAT_CHECKPOINTER_POSTGRES_URL: ${LUMEN_CHECKPOINTER_POSTGRES_URL:-}
      CHAT_MEMORY_PGVECTOR_URL: ${LUMEN_MEMORY_PGVECTOR_URL:-}
      KEYSTONE_AUTH_URL: ${LUMEN_KEYSTONE_AUTH_URL:-}
      KEYSTONE_ADMIN_USERNAME: ${LUMEN_KEYSTONE_ADMIN_USERNAME:-lumen}
      KEYSTONE_ADMIN_PASSWORD: ${LUMEN_KEYSTONE_ADMIN_PASSWORD:-}
      KEYSTONE_ADMIN_PROJECT: ${LUMEN_KEYSTONE_ADMIN_PROJECT:-lumen-service}
      KEYSTONE_DOMAIN: ${LUMEN_KEYSTONE_DOMAIN:-Default}
      KEYSTONE_REGION_NAME: ${LUMEN_KEYSTONE_REGION_NAME:-RegionOne}
      KEYSTONE_INTERFACE: ${LUMEN_KEYSTONE_INTERFACE:-internal}
      LUMEN_ENCRYPTION_KEY: ${LUMEN_ENCRYPTION_KEY:-}
      MCP_CONTROL_PLANE_URL: ${LUMEN_MCP_CONTROL_PLANE_URL:-}
      LUMEN_MCP_SERVICE_TOKEN: ${LUMEN_MCP_SERVICE_TOKEN:-}
    depends_on:
      redis:
        condition: service_started
      lumen-migrate:
        condition: service_completed_successfully
    restart: always

  palimpsest-bootstrap:
    profiles: ["palimpsest"]
    image: ${PALIMPSEST_API_IMAGE:-${REGISTRY:-ghcr.io/openstack-afterglow}/palimpsest-hub-api:${PALIMPSEST_IMAGE_TAG:-${IMAGE_TAG:-latest}}}
    pull_policy: always
    command: palimpsest-hub-bootstrap
    environment:
      DATABASE_URL: ${PALIMPSEST_DATABASE_URL:-}
      REDIS_URL: redis://redis:6379/9
      PALIMPSEST_HUB_LOCAL_PATH: /var/lib/palimpsest/hub
      OS_AUTH_URL: ${PALIMPSEST_OS_AUTH_URL:-}
      OS_USERNAME: ${PALIMPSEST_OS_USERNAME:-palimpsest}
      OS_PASSWORD: ${PALIMPSEST_OS_PASSWORD:-}
      OS_PROJECT_NAME: ${PALIMPSEST_OS_PROJECT_NAME:-palimpsest-service}
      OS_PROJECT_DOMAIN_NAME: ${PALIMPSEST_OS_PROJECT_DOMAIN_NAME:-Default}
      OS_USER_DOMAIN_NAME: ${PALIMPSEST_OS_USER_DOMAIN_NAME:-Default}
      OS_REGION_NAME: ${PALIMPSEST_OS_REGION_NAME:-RegionOne}
      OS_INTERFACE: ${PALIMPSEST_OS_INTERFACE:-internal}
      SSL_VERIFY: ${PALIMPSEST_SSL_VERIFY:-true}
    volumes:
      - palimpsest-hub:/var/lib/palimpsest/hub
    depends_on:
