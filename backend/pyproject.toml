[project]
name = "afterglow-api"
version = "1.20.0"
description = "Afterglow - OpenStack VM deployment platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.136.3",  # 0.137+ makes router.routes a tree; route inventory/audit requires flat routes.
    "uvicorn[standard]==0.39.0",
    "openstacksdk==3.3.0",
    "python-keystoneclient==5.4.0",
    "jinja2==3.1.6",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "python-multipart==0.0.31",
    "httpx==0.28.1",
    "httpcore==1.0.9",  # SafeAsyncTransport uses the pinned connection backend API.
    "aiofiles==24.1.0",
    "redis[hiredis]==5.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiomysql>=0.2.0",
    "prometheus-client>=0.20.0",
    "slowapi>=0.1.9",
    "pyyaml>=6.0",
    "boto3>=1.35.0",
    "websockets>=14.0",
    "pyjwt>=2.13.0",
    "asyncssh>=2.18",
    "idna>=3.15",
    "aiosmtplib>=3.0.0",
    "openpyxl>=3.1.5",
    # BFF-side MCP control plane and bounded content inspection; no model/agent runtime.
    "mcp==1.28.1",
    "jsonschema==4.26.0",
    "beautifulsoup4==4.14.3",
    "puremagic==1.30",
    "Pillow==12.3.0",
    "pypdf==6.15.0",
    "mutagen==1.47.0",
    "afterglow-crypto @ git+https://github.com/openstack-afterglow/afterglow-crypto.git@aee36e8ea173e486f443fa816de4e6397d11cff2",
    "waygate-sdk @ git+https://github.com/openstack-afterglow/waygate.git@1c59b5e86d3c3c1b9d3397b38301ee9bc401cf03#subdirectory=sdk",
    "drover-sdk @ git+https://github.com/openstack-afterglow/drover.git@bd4caa490eb3c21fdeb9cc8f008aaf02f72264ef#subdirectory=sdk",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
# Palimpsest 로컬 KVM 런타임 (선택). 설치하지 않으면 해당 엔드포인트만 503 이고
# 나머지 기능은 영향이 없다 — `services/palimpsest_kvm.py` 가 libvirt 를 지연 import 한다.
# libvirt-python 은 시스템 라이브러리(libvirt-dev)를 요구하므로 기본 이미지에는 넣지 않는다.
kvm = [
    "libvirt-python>=10.0.0",
]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "ruff>=0.7.0",
    "fakeredis[lua]>=2.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "slow: 장시간 또는 리소스 변경을 수행하는 live OpenStack 시나리오",
    "db: 일회용 MariaDB/PostgreSQL/Redis가 필요한 local functional 테스트",
    "redis: 실 Redis 또는 fakeredis 필요",
    "crypto: AES-GCM 등 암호화 단위 테스트 — 외부 인프라 불요",
    "contract: 외부/BFF 서비스 프록시 및 SDK 소비자 계약 검증",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv", "build", "dist", "__pycache__"]

[tool.ruff.lint]
# E/F: pycodestyle/pyflakes, I: isort, B: bugbear, UP: pyupgrade, SIM: simplify
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = [
    "E501",   # line-length 은 format 에서 처리
    "B008",   # FastAPI Depends() 는 default 인자에 함수 호출 필수
    "B904",   # FastAPI except 블록에서 raise from err/None 불필요 (HTTPException 패턴)
    "SIM103", # return 조건 inline 강요 — 가독성 저하 가능
    "SIM105", # try-except-pass → contextlib.suppress — 기존 패턴 유지
    "SIM108", # ternary 강요는 한국어 주석 많은 코드에서 가독성 저하
    "UP042",  # str+Enum → StrEnum — Python 3.11+ 한정, 호환성 위해 유지
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B", "SIM", "E402"]
# 조건부 서비스 import 패턴 (if settings.xxx: from module import Y) 사용하는 파일
"app/api/container/clusters.py" = ["E402"]
"app/api/identity/admin.py" = ["E402"]
"app/api/network/networks.py" = ["E402"]
"app/main.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
# 워커 전용 의존성 (fastapi/uvicorn/boto3/asyncssh 등 API 전용 패키지 제외).
# Dockerfile worker 스테이지에서 uv sync --only-group worker 로 설치.
worker = [
    "openstacksdk==3.3.0",
    "python-keystoneclient==5.4.0",
    "jinja2==3.1.6",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "httpx==0.28.1",
    "redis[hiredis]==5.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiomysql>=0.2.0",
    "prometheus-client>=0.20.0",
    "pyyaml>=6.0",
    "idna>=3.15",
    "apscheduler>=3.10",
    "waygate-sdk @ git+https://github.com/openstack-afterglow/waygate.git@1c59b5e86d3c3c1b9d3397b38301ee9bc401cf03#subdirectory=sdk",
    "drover-sdk @ git+https://github.com/openstack-afterglow/drover.git@bd4caa490eb3c21fdeb9cc8f008aaf02f72264ef#subdirectory=sdk",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
package = false
