# Afterglow native-cloud-vm: ssh.service drop-in. The image contains no SSH
# host keys; cloud-init's network stage (ordered before sshd) generates them on
# first boot. If cloud-init is disabled or found no datasource, generate the
# missing default keys here instead of failing sshd's configuration test.
[Service]
ExecStartPre=
ExecStartPre=/usr/bin/ssh-keygen -A
ExecStartPre=/usr/sbin/sshd -t
