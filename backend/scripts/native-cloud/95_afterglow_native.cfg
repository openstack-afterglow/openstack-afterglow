# Afterglow native-cloud-vm guest policy (installed in /etc/cloud/cloud.cfg.d).
# Nothing secret is baked into the image: SSH authorized keys come from
# Nova/ConfigDrive/NoCloud metadata, SSH host keys are generated on first boot,
# and an optional application configuration is delivered by user-data as
# /etc/afterglow/afterglow.conf (root, 0600), which afterglow-native-prepare
# copies once into /var/lib/afterglow/afterglow.conf for appuser.
datasource_list: [NoCloud, ConfigDrive, OpenStack, None]

disable_root: true
ssh_pwauth: false
ssh_deletekeys: true
ssh_genkeytypes: [ed25519, ecdsa, rsa]
# Print every host key and fingerprint on the serial console for pinning.
ssh_fp_console_blacklist: []
ssh_key_console_blacklist: []

preserve_hostname: false
manage_etc_hosts: true

growpart:
  mode: auto
  devices: ["/"]
resize_rootfs: true

system_info:
  default_user:
    name: debian
    gecos: Debian
    lock_passwd: true
    groups: [adm, sudo]
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    shell: /bin/bash
  network:
    renderers: [networkd]
    activators: [networkd]
