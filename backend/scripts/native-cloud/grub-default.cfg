# Afterglow native-cloud-vm: keep serial-console boot if update-grub later
# regenerates /boot/grub/grub.cfg inside the guest (installed in
# /etc/default/grub.d). The exported image's initial grub.cfg is written by
# scripts/export_native_cloud.py with the same console settings.
GRUB_TIMEOUT=1
GRUB_TERMINAL="serial console"
GRUB_SERIAL_COMMAND="serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1"
GRUB_CMDLINE_LINUX="console=tty0 console=ttyS0,115200n8"
GRUB_CMDLINE_LINUX_DEFAULT=""
