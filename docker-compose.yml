# Minimal standalone Afterglow frontend/backend. External DB/cache/catalog required.
# Current-source local services: docker-compose.dev.yml.
# Published-image production with TLS ingress: docker-compose.prod.yml.
name: afterglow

services:
  backend:
    image: ${REGISTRY:-ghcr.io/openstack-afterglow}/afterglow-api:${IMAGE_TAG:-latest}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./afterglow.conf:/app/afterglow.conf:ro
      - ./logs:/app/logs
    env_file:
      - path: .env
        required: false
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3080,http://127.0.0.1:3080}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3080}
      PUBLIC_API_BASE: ${PUBLIC_API_BASE:-http://localhost:8000}
      LUMEN_MCP_SERVICE_TOKEN: ${LUMEN_MCP_SERVICE_TOKEN:-}
      SERVICE_WAYGATE_INTERNAL_URL:
      SERVICE_DROVER_INTERNAL_URL:
      SERVICE_LUMEN_INTERNAL_URL:
      SERVICE_PALIMPSEST_INTERNAL_URL:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  frontend:
    image: ${REGISTRY:-ghcr.io/openstack-afterglow}/afterglow:${IMAGE_TAG:-latest}
    ports:
      - "127.0.0.1:3080:3080"
    volumes:
      - ./afterglow.conf:/app/afterglow.conf:ro
      - ./logs:/app/logs
    environment:
      ORIGIN: ${ORIGIN:-http://localhost:3080}
      PUBLIC_API_BASE: ${PUBLIC_API_BASE:-http://localhost:8000}
      PUBLIC_S3_BASE: ${PUBLIC_S3_BASE:-}
      PUBLIC_GRAFANA_BASE: ${PUBLIC_GRAFANA_BASE:-}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3080/health',{redirect:'error'}).then(async r=>{if(!r.ok||(await r.json()).status!=='ok')throw 1})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
