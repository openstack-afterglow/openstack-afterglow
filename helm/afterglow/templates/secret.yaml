{{- /*
  afterglow-secrets는 배포 서버가 ArgoCD Application에 주입하는 secret override
  (valuesObject.secrets, 또는 -f secrets-<env>.yaml)에서만 값이 채워진다.
  git에 커밋되는 values.yaml/values-<env>.yaml의 secrets는 빈 placeholder이므로,
  override가 없을 때 빈 값으로 실제 Secret을 덮어쓰지 않도록 osPassword가 있을 때만 렌더한다.
*/ -}}
{{- if .Values.secrets.osPassword }}
{{- $secretKey := required "secrets.secretKey is required when rendering afterglow-secrets" .Values.secrets.secretKey -}}
{{- $databaseUrl := required "secrets.databaseUrl is required when rendering afterglow-secrets" .Values.secrets.databaseUrl -}}
{{- $kubeconfigKey := required "secrets.k3sKubeconfigEncryptionKey is required when rendering afterglow-secrets" .Values.secrets.k3sKubeconfigEncryptionKey -}}
apiVersion: v1
kind: Secret
metadata:
  name: afterglow-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  OS_PASSWORD: {{ .Values.secrets.osPassword | quote }}
  SECRET_KEY: {{ $secretKey | quote }}
  K3S_KUBECONFIG_ENCRYPTION_KEY: {{ $kubeconfigKey | quote }}
  K3S_GPU_ADMISSION_TOKEN: {{ .Values.secrets.k3sGpuAdmissionToken | quote }}
  LUMEN_MCP_SERVICE_TOKEN: {{ .Values.secrets.lumenMcpServiceToken | quote }}
  CEPH_RBD_KEYRING: {{ .Values.secrets.cephRbdKeyring | quote }}
  DATABASE_URL: {{ $databaseUrl | quote }}
  PROMETHEUS_PASSWORD: {{ .Values.secrets.prometheusPassword | quote }}
  MONITORING_SD_TOKEN: {{ .Values.secrets.monitoringSDToken | quote }}
  MONITORING_INFRASTRUCTURE_TOPOLOGY_OBSERVERS: {{ .Values.secrets.infrastructureTopologyObservers | toJson | quote }}
  MONITORING_INFRASTRUCTURE_FABRIC__TARGETS: {{ .Values.secrets.infrastructureFabricTargets | toJson | quote }}
  TRAFFIC_ANALYTICS__HMAC_KEY: {{ .Values.secrets.trafficAnalyticsHmacKey | quote }}
  TRAFFIC_ANALYTICS__FRONTEND_INGEST_KEY: {{ .Values.secrets.trafficAnalyticsFrontendIngestKey | quote }}
  TRAFFIC_ANALYTICS_INGEST_KEY: {{ .Values.secrets.trafficAnalyticsFrontendIngestKey | quote }}
  NOTION_CONFIG_ENCRYPTION_KEY: {{ .Values.secrets.notionConfigEncryptionKey | quote }}
  SMTP_PASSWORD: {{ .Values.secrets.smtpPassword | quote }}
  BUILDER_SSH_PRIVATE_KEY: {{ .Values.secrets.builderSshPrivateKey | quote }}
  GRAFANA_ADMIN_PASSWORD: {{ .Values.secrets.grafanaAdminPassword | quote }}
  {{- range $name, $secret := .Values.secrets.authProviders }}
  {{ $name }}: {{ $secret | quote }}
  {{- end }}
{{- end }}
