{{- $appOrigin := (splitList "," .Values.cors.origins) | first | trim -}}
{{- $publicApiBase := (default (default $appOrigin .Values.app.frontendBaseUrl) .Values.app.publicApiBase) -}}
{{- $defaultMcpPublicURL := printf "%s/api/v1/mcp" (trimSuffix "/" $publicApiBase) -}}
{{- $mcpPublicURL := default $defaultMcpPublicURL .Values.mcp.publicUrl -}}
{{- $parsedMcpURL := urlParse $mcpPublicURL -}}
{{- /* Ingress hosts are DNS names, not URL authorities (which may include a port). */ -}}
{{- $mcpHost := lower (regexReplaceAll ":[0-9]+$" $parsedMcpURL.host "") -}}
{{- /* An explicit URL is the exact resource; a bare origin is served at "/". */ -}}
{{- $mcpPath := default "/" (regexReplaceAll "/+$" $parsedMcpURL.path "") -}}
{{- $mcpEnabled := and .Values.services.mcp $mcpPublicURL -}}
{{- if and $mcpEnabled (eq $mcpPath "/") (or (eq $mcpHost .Values.ingress.host) (has $mcpHost .Values.ingress.apiHosts)) -}}
{{- fail "mcp.publicUrl at an origin root requires a dedicated host; it cannot share the web or API host" -}}
{{- end -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: afterglow-ingress
  namespace: {{ .Release.Namespace }}
  annotations:
    kubernetes.io/ingress.class: {{ .Values.ingress.ingressClass | quote }}
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-afterglow-upload-timeout@kubernetescrd
    traefik.ingress.kubernetes.io/service.serverstransport: {{ .Release.Namespace }}-backend-long-timeout@kubernetescrd
    cert-manager.io/cluster-issuer: {{ .Values.ingress.certIssuer | quote }}
spec:
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
        {{- range .Values.ingress.apiHosts }}
        - {{ . }}
        {{- end }}
        {{- if $mcpEnabled }}
        {{- if and (ne $mcpHost $.Values.ingress.host) (not (has $mcpHost $.Values.ingress.apiHosts)) }}
        - {{ $mcpHost }}
        {{- end }}
        {{- end }}
      secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
    # 기본 host — 웹 앱(/) + 내부 API(/api). 외부 /v1 은 여기서 노출하지 않는다.
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          {{- if $mcpEnabled }}
          {{- if eq $mcpHost $.Values.ingress.host }}
          - path: {{ $mcpPath | quote }}
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /.well-known
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          {{- end }}
          {{- end }}
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3080
    {{- range .Values.ingress.apiHosts }}
    # 외부 API 전용 서브도메인 — /v1(OpenAI/Anthropic 호환)은 Lumen 서비스(포트 8012)가 제공한다. 나머지는 프론트(랜딩).
    - host: {{ . }}
      http:
        paths:
          {{- if $mcpEnabled }}
          {{- if eq $mcpHost . }}
          - path: {{ $mcpPath | quote }}
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /.well-known
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          {{- end }}
          {{- end }}
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: lumen
                port:
                  number: 8012
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3080
    {{- end }}
    {{- if $mcpEnabled }}
    {{- if and (ne $mcpHost $.Values.ingress.host) (not (has $mcpHost $.Values.ingress.apiHosts)) }}
    # Public Streamable HTTP MCP resource and OAuth discovery endpoints only; the
    # rest of the backend API is never published on the dedicated MCP host.
    - host: {{ $mcpHost }}
      http:
        paths:
          {{- if eq $mcpPath "/" }}
          - path: "/"
            pathType: Exact
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /oauth
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          {{- else }}
          - path: {{ $mcpPath | quote }}
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          {{- end }}
          - path: /.well-known
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
    {{- end }}
    {{- end }}
