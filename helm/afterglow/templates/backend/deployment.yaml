apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: {{ .Release.Namespace }}
  labels:
    app: backend
spec:
  replicas: {{ .Values.replicaCount.backend }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      {{- if and (eq .Values.workerRuntime.mode "kubernetes") .Values.workerRuntime.kubernetes.serviceAccountName }}
      serviceAccountName: {{ .Values.workerRuntime.kubernetes.serviceAccountName | quote }}
      {{- end }}
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: {{ .Values.image.backend.repository }}:{{ .Values.image.backend.tag }}
          imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
          command:
            - "uvicorn"
            - "app.main:app"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
            - "--workers"
            - "4"
            - "--timeout-keep-alive"
            - "65"
            - "--loop"
            - "uvloop"
            - "--http"
            - "httptools"
          ports:
            - containerPort: 8000
          env:
            - name: AFTERGLOW_ENV
              value: "production"
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: afterglow-config
                  key: APP_REDIS_URL
            - name: OS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: afterglow-secrets
                  key: OS_PASSWORD
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: afterglow-secrets
                  key: SECRET_KEY
            - name: GITLAB_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: afterglow-secrets
                  key: GITLAB_OIDC_CLIENT_SECRET
            - name: K3S_KUBECONFIG_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: afterglow-secrets
                  key: K3S_KUBECONFIG_ENCRYPTION_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: afterglow-secrets
                  key: DATABASE_URL
            - name: PROMETHEUS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: afterglow-secrets
                  key: PROMETHEUS_PASSWORD
          volumeMounts:
            - name: afterglow-config-volume
              mountPath: /app/afterglow.conf
              subPath: afterglow.conf
            - name: afterglow-config-volume
              mountPath: /app/config.gpu.toml
              subPath: config.gpu.toml
            - name: builder-ssh-key
              mountPath: /etc/afterglow/ssh
              readOnly: true
            - name: ceph-conf
              mountPath: /etc/ceph/ceph.conf
              subPath: ceph.conf
              readOnly: true
            - name: ceph-rbd-keyring
              mountPath: /etc/ceph/ceph.client.afterglow-rbd.keyring
              subPath: ceph.client.afterglow-rbd.keyring
              readOnly: true
            - name: app-logs
              mountPath: /app/logs
          # startupProbe: 노드 I/O 저하 시 import가 10분+ 걸릴 수 있어 20분까지 허용
          # (2026-06-12 워커 재부팅 장애: 5분 한도로 backend 크래시루프 발생)
          startupProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 240
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            periodSeconds: 5
            failureThreshold: 2
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.resources.backend | nindent 12 }}
      volumes:
        - name: afterglow-config-volume
          configMap:
            name: afterglow-config
            items:
              - key: afterglow.conf
                path: afterglow.conf
              - key: config.gpu.toml
                path: config.gpu.toml
        - name: builder-ssh-key
          secret:
            secretName: afterglow-secrets
            items:
              - key: BUILDER_SSH_PRIVATE_KEY
                path: builder.key
            defaultMode: 0400
        - name: ceph-conf
          configMap:
            name: afterglow-config
            items:
              - key: ceph.conf
                path: ceph.conf
        - name: ceph-rbd-keyring
          secret:
            secretName: afterglow-secrets
            items:
              - key: CEPH_RBD_KEYRING
                path: ceph.client.afterglow-rbd.keyring
            defaultMode: 0400
        - name: app-logs
          emptyDir: {}
