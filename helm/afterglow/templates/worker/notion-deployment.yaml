apiVersion: apps/v1
kind: Deployment
metadata:
  name: notion-worker
  namespace: {{ .Release.Namespace }}
  labels:
    app: notion-worker
spec:
  replicas: {{ .Values.replicaCount.notionWorker }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: notion-worker
  template:
    metadata:
      labels:
        app: notion-worker
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: notion-worker
          image: {{ .Values.image.worker.repository }}:{{ .Values.image.worker.tag }}
          imagePullPolicy: {{ .Values.image.worker.pullPolicy }}
          command:
            - "python"
            - "-m"
            - "app.notion_worker"
          env:
            - name: AFTERGLOW_ENV
              value: "production"
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: afterglow-config
                  key: APP_REDIS_URL
            - name: OS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: afterglow-secrets
                  key: OS_PASSWORD
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: afterglow-secrets
                  key: SECRET_KEY
            - name: K3S_KUBECONFIG_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: afterglow-secrets
                  key: K3S_KUBECONFIG_ENCRYPTION_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: afterglow-secrets
                  key: DATABASE_URL
            - name: NOTION_CONFIG_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: afterglow-secrets
                  key: NOTION_CONFIG_ENCRYPTION_KEY
                  optional: true
            {{- range .Values.auth.providerKeys }}
            - name: {{ printf "AUTH__PROVIDERS__%s__CLIENT_SECRET" (upper .) }}
              valueFrom:
                secretKeyRef:
                  name: afterglow-secrets
                  key: {{ printf "AUTH__PROVIDERS__%s__CLIENT_SECRET" (upper .) }}
                  optional: true
            {{- end }}
          volumeMounts:
            - name: afterglow-config-volume
              mountPath: /app/afterglow.conf
              subPath: afterglow.conf
            - name: afterglow-config-volume
              mountPath: /app/config.gpu.toml
              subPath: config.gpu.toml
          resources:
            {{- toYaml .Values.resources.notionWorker | nindent 12 }}
      volumes:
        - name: afterglow-config-volume
          configMap:
            name: afterglow-config
            items:
              - key: afterglow.conf
                path: afterglow.conf
              - key: config.gpu.toml
                path: config.gpu.toml
