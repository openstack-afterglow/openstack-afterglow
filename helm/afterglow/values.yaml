# -----------------------------------------------------------------------------
# [services]
# -----------------------------------------------------------------------------
services:
  magnum: false
  manila: true
  zun: false
  k3s: true
  swift: false
  trove: false
  barbican: false
  mcp: false

# -----------------------------------------------------------------------------
# [mcp]
# -----------------------------------------------------------------------------
mcp:
  publicUrl: ""
  oauthConsentUrl: ""

# -----------------------------------------------------------------------------
# [k3s]
# -----------------------------------------------------------------------------
k3s:
  version: ""
  serverFlavorId: ""
  defaultAgentFlavorId: ""
  serverImageId: ""
  fcosImageId: ""
  callbackBaseUrl: ""
  bootVolumeSizeGb: 50
  occmEnabled: false
  occmImage: ""
  occmFloatingNetworkId: ""
  occmPublicNetworkName: ""
  cinderCsiEnabled: false
  cinderCsiImage: ""
  cinderCsiDefaultAz: ""
  manilaCsiEnabled: false
  manilaCsiImage: ""
  manilaCsiNfsImage: ""
  manilaCsiShareProtocol: "NFS"
  keystoneAuthEnabled: false
  keystoneAuthImage: ""
  keystoneAuthPolicy: ""
  octaviaIngressEnabled: false
  octaviaIngressImage: ""
  octaviaIngressSubnetId: ""
  octaviaIngressFloatingNetworkId: ""
  barbicanKmsEnabled: false
  barbicanKmsImage: ""
  barbicanKmsKekId: ""
  apiLbEnabled: false
  apiLbVipNetworkId: ""
  apiLbFloatingNetworkId: ""
  lbSubnetId: ""
  certRotationJobImage: ""
  certRotationNodeTimeoutSec: 300
  stampedeEnabled: false
  stampedeInterval: 60
  stampedeScaleDownWindow: 300
  stampedeScaleUpCooldown: 120
  stampedeScaleDownCooldown: 300
  stampedeScaleDownThreshold: 0.3
  stampedeResourceHeadroomFactor: 1.2

# -----------------------------------------------------------------------------
# [database]
# -----------------------------------------------------------------------------
database:
  poolSize: 10
  maxOverflow: 20
  autoCreateTables: true
  connectTimeout: 10
  poolTimeout: 30
  unhealthySeconds: 60
  dbAutoBackupCron: ""

# -----------------------------------------------------------------------------
# [cors]
# -----------------------------------------------------------------------------
cors:
  origins: "https://afterglow.example.com,http://localhost:3080,http://127.0.0.1:3080"

# -----------------------------------------------------------------------------
# [gitlab_oidc]
# -----------------------------------------------------------------------------
gitlabOidc:
  enabled: false
  gitlabUrl: "https://gitlab.com"
  clientId: ""
  idpId: "gitlab"
  protocolId: "openid"
  redirectUri: ""
  scopes: "openid email profile read_user"

# -----------------------------------------------------------------------------
# [smtp]
# -----------------------------------------------------------------------------
smtp:
  enabled: false
  host: ""
  port: 587
  username: ""
  fromAddress: "noreply@afterglow.example.com"
  fromName: "Afterglow"
  useTls: true
  timeoutSeconds: 10
  invitation:
    tokenExpiryDays: 7

# -----------------------------------------------------------------------------
# [monitoring]
# -----------------------------------------------------------------------------
monitoring:
  enabled: true
  prometheusBaseUrl: "http://prometheus:9090"
  prometheusUsername: ""
  scrapeCidr: ""
  autoSgEnabled: true
  nodeExporterSgName: "node_exporter"
  dcgmExporterSgName: "dcgm_exporter"
  nodeExporterPort: 9100
  dcgmExporterPort: 9400
  libvirtExporterPort: 9177
  gpuFlavorPrefix: "gpu."
  grafanaBaseUrl: ""
  dashboards:
    nodeUid: "afterglow-node"
    rabbitmqUid: "afterglow-rabbitmq"
    mysqldUid: "afterglow-mysqld"
    memcachedUid: "afterglow-memcached"
    etcdUid: "afterglow-etcd"
    haproxyUid: "afterglow-haproxy"
    libvirtUid: "afterglow-libvirt"
    openstackUid: "afterglow-openstack"
    cephUid: "afterglow-ceph"
    instanceCpuUid: "afterglow-instance-cpu"
    instanceGpuUid: "afterglow-instance-gpu"
  grafana:
    image: "grafana/grafana:11.0.0"
    # adminPassword는 secrets.grafanaAdminPassword 로 주입됩니다
    replicas: 1
  prometheus:
    image: "prom/prometheus:v2.51.0"
    replicas: 1
  opensearch:
    enabled: false
    image: "opensearchproject/opensearch:2.13.0"
    replicas: 1
    storageSize: "10Gi"
    javaOpts: "-Xms512m -Xmx512m"
    # 보안 플러그인 비활성화 여부 (기본 false = 보안 활성화)
    # 개발 환경에서만 true로 설정할 것
    disableSecurityPlugin: false

# -----------------------------------------------------------------------------
# [notion]
# -----------------------------------------------------------------------------
notion:
  enabled: false

# -----------------------------------------------------------------------------
# [logging]
# -----------------------------------------------------------------------------
logging: {}

# -----------------------------------------------------------------------------
# [security]
# -----------------------------------------------------------------------------
security:
  adminLegacyProjectPolicy: false
  loginMaxAttempts: 10
  loginLockoutSeconds: 300
  loginBackoffBase: 2

# -----------------------------------------------------------------------------
# 리소스 요청/제한
# -----------------------------------------------------------------------------
resources:
  backend:
    requests:
      memory: "512Mi"
      cpu: "1"
    limits:
      memory: "2Gi"
      cpu: "4"
  frontend:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "512Mi"
      cpu: "300m"
  worker:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "300m"
  notionWorker:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  redis:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "200m"
  sentinel:
    requests:
      memory: "32Mi"
      cpu: "25m"
    limits:
      memory: "64Mi"
      cpu: "100m"
  grafana:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  prometheus:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  opensearch:
    requests:
      memory: "512Mi"
      cpu: "200m"
    limits:
      memory: "1Gi"
      cpu: "500m"
