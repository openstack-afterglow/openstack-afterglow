# =============================================================================
# Afterglow Helm Chart — values.yaml
# 이 파일의 값만 수정하면 배포가 완료됩니다.
# 환경별 오버라이드: values-dev.yaml / values-prod.yaml
# =============================================================================

# -----------------------------------------------------------------------------
# 이미지
# -----------------------------------------------------------------------------
image:
  backend:
    repository: ghcr.io/openstack-afterglow/afterglow-api
    tag: latest
    pullPolicy: Always
  frontend:
    repository: ghcr.io/openstack-afterglow/afterglow
    tag: latest
    pullPolicy: Always
  worker:
    repository: ghcr.io/openstack-afterglow/afterglow-worker
    tag: latest
    pullPolicy: Always

# -----------------------------------------------------------------------------
# 레플리카 수
# -----------------------------------------------------------------------------
replicaCount:
  backend: 2
  frontend: 2
  worker: 1
  notionWorker: 1
  redis: 3
  sentinel: 3

# -----------------------------------------------------------------------------
# Background worker runtime manager (disabled/static by default)
# static 이면 이 블록은 선언적 설정일 뿐이며, 워커는 templates/worker/*.yaml 의 고정
# Deployment 로 실행된다. kubernetes 모드로 켜려면 환경별 values-<env>.yaml 에서
# mode: kubernetes + kubernetes.rbac.create: true 로 override 한다(deploy/values-dev-example.yaml 참조).
# 그러면 백엔드 SA 에 deployments/scale 권한이 부여되고 매니저가 replicas 를 조정한다.
# -----------------------------------------------------------------------------
workerRuntime:
  mode: static
  reconcileInterval: 30
  failClosed: true
  workers:
    drover:
      enabled: true
      desiredReplicas: 1
      maxReplicas: 1
      module: app.worker
    notionWorker:
      enabled: true
      desiredReplicas: 1
      maxReplicas: 1
      module: app.notion_worker
  docker:
    socketPath: ""
    image: ""
    network: ""
    configMount: /app/afterglow.conf
    configHostPath: ""
    gpuConfigMount: /app/config.gpu.toml
    gpuConfigHostPath: ""
    # Kubernetes backend/frontend Deployment는 /app/logs 에 pod-local emptyDir 볼륨을
    # 마운트합니다 (fsGroup 1000 쓰기 허용, PVC/hostPath 미사용, 파드 수명주기 종속 휘발성 스토리지).
    logsMount: /app/logs
    logsHostPath: ""
    envAllowlist: "AFTERGLOW_ENV,AFTERGLOW_ALLOW_INSECURE,SECRET_KEY,OS_PASSWORD,DATABASE_URL,K3S_KUBECONFIG_ENCRYPTION_KEY,PROMETHEUS_PASSWORD,GITLAB_OIDC_CLIENT_SECRET,NOTION_CONFIG_ENCRYPTION_KEY"
  kubernetes:
    namespace: ""
    serviceAccountName: afterglow-backend-worker-runtime
    serviceAccountTokenPath: /var/run/secrets/kubernetes.io/serviceaccount/token
    serviceAccountCaPath: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    rbac:
      create: false

# -----------------------------------------------------------------------------
# 인그레스
# -----------------------------------------------------------------------------
ingress:
  host: afterglow.example.com
  certIssuer: letsencrypt-prod-traefik
  tlsSecretName: afterglow-tls
  ingressClass: traefik
  # 외부 OpenAI/Anthropic 호환 API(/v1) 전용 서브도메인. 여기로 들어온 요청만 /v1 을 백엔드로 라우팅한다.
  # 기본 host 에서는 /v1 이 프론트로 가 노출되지 않는다(충돌·오용 방지). backend 의 chat_api_hosts 와 일치시킬 것.
  # 예: ["api.cloud.dmslab.re.kr", "api.test.cloud.dmslab.re.kr"]
  apiHosts: []

# -----------------------------------------------------------------------------
# 시크릿 (실제 값은 --set 또는 values-prod.yaml 로 주입)
# -----------------------------------------------------------------------------
secrets:
  osPassword: ""
  secretKey: ""
  gitlabOidcClientSecret: ""
  k3sKubeconfigEncryptionKey: ""
  databaseUrl: ""
  prometheusPassword: ""
  monitoringSDToken: ""
  notionConfigEncryptionKey: ""
  smtpPassword: ""
  # 멀티라인 PEM 키: |로 시작하는 블록 스칼라로 입력
  builderSshPrivateKey: ""
  # Grafana 관리자 비밀번호 (반드시 배포 시 --set으로 주입)
  grafanaAdminPassword: ""

# -----------------------------------------------------------------------------
# [openstack]
# -----------------------------------------------------------------------------
openstack:
  authUrl: "http://keystone.example.com:5000/v3"
  projectName: "admin"
  projectDomainName: "Default"
  userDomainName: "Default"
  regionName: "RegionOne"
  username: "admin"
  interface: "internal"
  insecure: false
  cacert: ""
  # Manila
  manilaEndpoint: ""
  manilaShareNetworkId: ""
  manilaShareType: "cephfs"
  manilaNfsShareType: "nfstype"
  manilaNfsRootSquash: true
  manilaNfsSecFlavor: "sys"
  manilaCephxKeyTimeoutSeconds: 300
  # Ceph / Union
  cephMonitors: ""
  serviceProjectId: ""
  # Swift
  swiftEndpoint: ""
  swiftUploadTimeout: 600
  trashRetentionDays: 30
  # S3 (CSP frame-src용)
  s3Endpoint: "https://s3.dmslab.re.kr"

# -----------------------------------------------------------------------------
# [app]
# -----------------------------------------------------------------------------
app:
  backendPort: 8000
  frontendPort: 3080
  siteName: "Afterglow"
  siteDescription: "OpenStack VM + OverlayFS 배포 플랫폼"
  logoPath: "/logo.png"
  faviconPath: "/favicon.ico"
  refreshIntervalMs: 5000
  frontendBaseUrl: ""
  publicApiBase: ""
  trustedProxies: "127.0.0.1/32,::1/128"

# -----------------------------------------------------------------------------
# [cache]
# -----------------------------------------------------------------------------
cache:
  ttlFast: 15
  ttlNormal: 30
  ttlSlow: 60
  ttlStatic: 300
  defaultTtlSeconds: 30
  backend: "redis"
  dynamicThresholdLow: 5
  dynamicThresholdHigh: 20
  ttlIdentityStable: 86400
  ttlCatalogSlow: 900
  ttlProjectMeta: 300
  ttlOperationalLive: 30
  ttlAdminOverview: 60
  ttlAuthToken: 60

# -----------------------------------------------------------------------------
# [session]
# -----------------------------------------------------------------------------
session:
  timeoutSeconds: 3600
  warningBeforeSeconds: 300
  absoluteTimeout: 14400
  jwtAccessTtl: 900
  jwtRefreshTtl: 604800
  tokenIpBindingMode: "subnet"

# -----------------------------------------------------------------------------
# [nova]
# -----------------------------------------------------------------------------
nova:
  defaultNetworkId: ""
  defaultAvailabilityZone: "nova"
  bootVolumeSizeGb: 20
  upperVolumeSizeGb: 50
  defaultNetworkEnabled: true
  defaultNetworkCidr: "192.168.0.0/24"
  defaultNetworkExternalId: ""

# -----------------------------------------------------------------------------
# [builder]
# -----------------------------------------------------------------------------
builder:
  imageId: ""
  flavorId: ""
  networkId: ""
  persistentServerId: ""
  sshUser: "ubuntu"
  sshKeyPath: "/etc/afterglow/ssh/builder.key"
  sshHost: ""
  floatingNetworkId: ""
  buildTimeout: 3600

# -----------------------------------------------------------------------------
# [union]
# -----------------------------------------------------------------------------
union:
  layerStoreRwShareId: ""
  layerStoreRoShareId: ""
  manifestStoreShareId: ""

# -----------------------------------------------------------------------------
# [gpu]
# -----------------------------------------------------------------------------
gpu:
  availableVisible: true
  configToml: |
    # Afterglow GPU 디바이스 맵 오버라이드
    #
    # 이 파일을 `config.gpu.toml`로 복사하여 같은 디렉터리의 `afterglow.conf`
    # 옆에 두면 백엔드 기동 시 자동으로 딥 머지되어 적용됩니다.
    #
    # 복사: cp config.gpu.toml.example config.gpu.toml
    #
    # 머지 규칙: dict는 재귀 병합, 리스트/스칼라는 이 파일이 덮어쓴다.
    # 즉, [[gpu.devices]] 엔트리를 여기에 두면 afterglow.conf의 동일 키를 완전히 대체한다.
    
    [gpu]
    # GPU 디바이스 맵 커스터마이징
    # vendor_id / device_id: lspci -nn 출력의 PCI ID (대문자 hex)
    # is_audio: HDMI/DP 오디오 장치이면 true (GPU 카운트에서 제외됨)
    # aliases: OpenStack flavor의 pci_passthrough:alias 이름 또는 flavor 이름에서 추출되는 짧은 이름 목록
    #          예) gpu.3090_8c_16g → "3090", pci_passthrough:alias = "RTX3090:1" → "RTX3090"
    #          GPU Spec Notion DB와 인스턴스를 매칭할 때 사용됩니다.
    # 변경 후 백엔드를 재시작해야 적용됩니다.
    
    # === Maxwell ===
    [[gpu.devices]]
    vendor_id = "10DE"
    device_id = "17C2"
    name = "GTX TITAN X"
    is_audio = false
    aliases = ["GTX_TITAN_X", "gtx_titan", "gtx_titan_x"]
    
    [[gpu.devices]]
    vendor_id = "10DE"
    device_id = "0FB0"
    name = "GM200 Audio"
    is_audio = true
    
    # === Pascal ===
