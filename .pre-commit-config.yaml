repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.0
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/
  - repo: local
    hooks:
      - id: architecture
        name: architecture freshness
        entry: python3 scripts/check_architecture.py --staged
        language: system
        always_run: true
        pass_filenames: false
