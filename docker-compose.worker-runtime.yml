# docker-compose.worker-runtime.yml — worker_runtime "docker" 모드 오버레이 (opt-in)
#
# 목적: 백엔드가 Docker Engine API로 Notion 워커 컨테이너를 직접 생성·관리하도록
#       활성화한다. 독립 Drover worker에는 영향을 주지 않는다.
#
# ⚠️ 보안 경고 — 개발/단일 신뢰 호스트 전용. 프로덕션·멀티테넌트 호스트에서 사용 금지.
#   /var/run/docker.sock 마운트는 백엔드 컨테이너에 호스트 Docker 데몬 full 제어권(= 호스트
#   root 등가)을 준다. 백엔드에 RCE 가 생기면 곧바로 호스트 탈취로 이어진다. 소켓 bind 에 :ro 를
#   붙여도 Docker API 쓰기를 막지 못하므로 보안 효과가 없다(사용하지 말 것).
#   더 안전한 운영이 필요하면 docker-socket-proxy(예: tecnativa/docker-socket-proxy)로 API 를
#   containers create/start/delete/list 로 제한하거나, kubernetes 모드를 사용하라.
#
# 사용법:
#   1) .local-services/afterglow.conf 에 아래를 설정 (호스트 절대경로 필수):
#        [worker_runtime]
#        mode = "docker"
#        [worker_runtime.docker]
#        socket_path      = "/var/run/docker.sock"
#        image            = "afterglow-local-services/notion-worker:current"
#        network          = "afterglow-local-services_default"
#        config_host_path = "/absolute/host/path/to/.local-services/afterglow.conf"
#        logs_host_path   = "/absolute/host/path/to/.local-services/logs"  # 선택
#        env_allowlist    = "AFTERGLOW_ALLOW_INSECURE,SECRET_KEY,OS_PASSWORD,DATABASE_URL,K3S_KUBECONFIG_ENCRYPTION_KEY,PROMETHEUS_PASSWORD,GITLAB_OIDC_CLIENT_SECRET,NOTION_CONFIG_ENCRYPTION_KEY"
#      주의: env_allowlist 에 나열된 키 중 SECRET_KEY 또는 AFTERGLOW_ALLOW_INSECURE 가 백엔드
#            환경에 실제로 존재해야 한다(둘 다 없으면 fail-closed 로 컨테이너를 만들지 않는다).
#            config_host_path 는 백엔드 컨테이너 내부 경로가 아니라 호스트 경로여야 한다.
#
#   2) 이 오버레이와 함께 기동:
#        docker compose --env-file .local-services/compose.env -f docker-compose.dev.yml -f docker-compose.worker-runtime.yml up
#
# 동작: 정적 notion-worker 서비스는 "manual" 프로필로 밀려나 기본 기동에서 제외되고,
#       백엔드가 afterglow-managed-notion-worker-0 컨테이너를 reconcile 루프로 생성·유지한다.
#       Admin API(PATCH /api/v1/admin/worker-runtime/desired)로
#       0↔max_replicas 범위에서 조정할 수 있다(기본 max_replicas=1 → pause/resume).
services:
  backend:
    # 백엔드가 Docker Engine API 로 워커 컨테이너를 관리하려면 소켓 접근이 필요하다.
    # 커밋되는 기본 docker-compose.yml 에는 절대 넣지 않는다(이 오버레이에서만).
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # 정적 워커는 매니저가 만드는 managed 컨테이너와 중복되므로 기본 기동에서 제외한다.
  # (프로필을 부여하면 활성 프로필 목록에 없을 때 기동되지 않는다.)
  notion-worker:
    profiles: ["manual"]
