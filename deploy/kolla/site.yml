---
# Kolla-Ansible site playbook integration for Afterglow services
# Runtime plays own privilege escalation so standard deploy needs no CLI -b.
# Keep controller-side credential/file preparation explicitly become: false.

- name: Gather facts for all hosts
  hosts: all
  serial: "{{ kolla_serial | default('0') }}"
  gather_facts: false
  tasks:
    - name: Gather facts
      ansible.builtin.setup:
        filter: "{{ kolla_ansible_setup_filter }}"
        gather_subset: "{{ kolla_ansible_setup_gather_subset }}"
      when:
        - not ansible_facts
  tags: always
- name: Custom service inventory preflight check
  hosts: all
  gather_facts: false
  run_once: true
  tags: [always, afterglow, waygate, drover, lumen, palimpsest]
  tasks:
    - name: Assert inventory group for enabled afterglow
      ansible.builtin.assert:
        that:
          - groups.get('afterglow', []) | length > 0
        fail_msg: "Enabled custom service 'afterglow' requires a non-empty '[afterglow]' inventory group. Add it to /etc/kolla/multinode; standard lifecycle commands require the additive plugin installer to have completed."
      when: enable_afterglow | default(false) | bool

    - name: Assert inventory group for enabled waygate
      ansible.builtin.assert:
        that:
          - groups.get('waygate', []) | length > 0
        fail_msg: "Enabled custom service 'waygate' requires a non-empty '[waygate]' inventory group. Add it to /etc/kolla/multinode; standard lifecycle commands require the additive plugin installer to have completed."
      when: enable_waygate | default(false) | bool

    - name: Assert inventory group for enabled drover
      ansible.builtin.assert:
        that:
          - groups.get('drover', []) | length > 0
        fail_msg: "Enabled custom service 'drover' requires a non-empty '[drover]' inventory group. Add it to /etc/kolla/multinode; standard lifecycle commands require the additive plugin installer to have completed."
      when: enable_drover | default(false) | bool

    - name: Assert inventory group for enabled lumen
      ansible.builtin.assert:
        that:
          - groups.get('lumen', []) | length > 0
        fail_msg: "Enabled custom service 'lumen' requires a non-empty '[lumen]' inventory group. Add it to /etc/kolla/multinode; standard lifecycle commands require the additive plugin installer to have completed."
      when: enable_lumen | default(false) | bool

    - name: Assert inventory group for enabled palimpsest
      ansible.builtin.assert:
        that:
          - groups.get('palimpsest', []) | length > 0
        fail_msg: "Enabled custom service 'palimpsest' requires a non-empty '[palimpsest]' inventory group. Add it to /etc/kolla/multinode; standard lifecycle commands require the additive plugin installer to have completed."
      when: enable_palimpsest | default(false) | bool

- name: Apply role afterglow
  gather_facts: false
  hosts: afterglow
  become: true
  serial: "{{ kolla_serial | default('0') }}"
  tasks:
    - name: Prepare Afterglow application image references
      ansible.builtin.include_role:
        name: afterglow
        tasks_from: resolve_image_refs
        public: false
        apply:
          tags: afterglow
      vars:
        afterglow_image_ref_service: afterglow
      tags: afterglow
      when:
        - enable_afterglow | default(false) | bool
        - kolla_action | default('deploy') in ['precheck', 'pull', 'deploy', 'reconfigure', 'upgrade']

    - name: Apply role afterglow
      ansible.builtin.include_role:
        name: afterglow
        apply:
          tags: afterglow
      tags: afterglow
      when: enable_afterglow | default(false) | bool

- name: Apply role waygate
  gather_facts: false
  hosts: waygate
  become: true
  serial: "{{ kolla_serial | default('0') }}"
  tags: [waygate, waygat]
  tasks:
    - name: Prepare Waygate application image references
      ansible.builtin.include_role:
        name: afterglow
        tasks_from: resolve_image_refs
        public: false
        apply:
          tags: waygate
      vars:
        afterglow_image_ref_service: waygate
      tags: waygate
      when:
        - enable_waygate | default(false) | bool
        - kolla_action | default('deploy') in ['precheck', 'pull', 'deploy', 'reconfigure', 'upgrade']

    - name: Apply role waygate
      ansible.builtin.include_role:
        name: waygate
        apply:
          tags: waygate
      tags: waygate
      when: enable_waygate | default(false) | bool

