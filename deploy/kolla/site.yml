      tags: palimpsest
      when:
        - enable_palimpsest | default(false) | bool
        - kolla_action | default('deploy') in ['precheck', 'pull', 'deploy', 'reconfigure', 'upgrade']

    - name: Apply role palimpsest
      ansible.builtin.include_role:
        name: palimpsest
        apply:
          tags: palimpsest
      tags: palimpsest
      when: enable_palimpsest | default(false) | bool

- name: Configure plugin HAProxy routes
  gather_facts: false
  hosts: loadbalancer
  become: true
  serial: "{{ kolla_serial | default('0') }}"
  tags: haproxy
  tasks:
    # Use Kolla's native config/check path. The check task recreates HAProxy only
    # when the resulting configuration hash changes.
    - name: Render Kolla HAProxy base configuration
      ansible.builtin.include_role:
        name: loadbalancer
        tasks_from: config
        apply:
          tags: [afterglow, waygate, waygat, drover, lumen, palimpsest, haproxy]
      tags: [afterglow, waygate, waygat, drover, lumen, palimpsest, haproxy]
      when:
        - kolla_action | default('deploy') in ['deploy', 'reconfigure', 'upgrade', 'config']
        - enable_haproxy | default(true) | bool

    - name: Render Afterglow HAProxy routes
      ansible.builtin.include_role:
        name: afterglow
        tasks_from: loadbalancer
        apply:
          tags: [afterglow, haproxy]
      tags: [afterglow, haproxy]
      when:
        - kolla_action | default('deploy') in ['deploy', 'reconfigure', 'upgrade', 'config']
        - enable_haproxy | default(true) | bool
        - enable_afterglow | default(false) | bool

    - name: Render Waygate HAProxy routes
      ansible.builtin.include_role:
        name: waygate
        tasks_from: loadbalancer
        apply:
          tags: [waygate, waygat, haproxy]
      tags: [waygate, waygat, haproxy]
      when:
        - kolla_action | default('deploy') in ['deploy', 'reconfigure', 'upgrade', 'config']
        - enable_haproxy | default(true) | bool
        - enable_waygate | default(false) | bool

    - name: Render Drover HAProxy routes
      ansible.builtin.include_role:
        name: drover
        tasks_from: loadbalancer
        apply:
          tags: [drover, haproxy]
      tags: [drover, haproxy]
      when:
        - kolla_action | default('deploy') in ['deploy', 'reconfigure', 'upgrade', 'config']
        - enable_haproxy | default(true) | bool
        - enable_drover | default(false) | bool

    - name: Render Lumen HAProxy routes
      ansible.builtin.include_role:
        name: lumen
        tasks_from: loadbalancer
        apply:
          tags: [lumen, haproxy]
      tags: [lumen, haproxy]
      when:
        - kolla_action | default('deploy') in ['deploy', 'reconfigure', 'upgrade', 'config']
        - enable_haproxy | default(true) | bool
        - enable_lumen | default(false) | bool

    - name: Render Palimpsest HAProxy routes
      ansible.builtin.include_role:
        name: palimpsest
        tasks_from: loadbalancer
        apply:
          tags: [palimpsest, haproxy]
      tags: [palimpsest, haproxy]
      when:
        - kolla_action | default('deploy') in ['deploy', 'reconfigure', 'upgrade', 'config']
        - enable_haproxy | default(true) | bool
        - enable_palimpsest | default(false) | bool

    - name: Reconcile Kolla HAProxy after plugin route changes
      ansible.builtin.include_role:
        name: loadbalancer
        tasks_from: check-containers
        apply:
          tags: [afterglow, waygate, waygat, drover, lumen, palimpsest, haproxy]
      tags: [afterglow, waygate, waygat, drover, lumen, palimpsest, haproxy]
      when:
        - kolla_action | default('deploy') in ['deploy', 'reconfigure', 'upgrade']
        - enable_haproxy | default(true) | bool
