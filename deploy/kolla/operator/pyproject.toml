[project]
name = "afterglow-kolla-operator"
version = "0.1.0"
description = "Afterglow Kolla-Ansible operator environment specification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "kolla-ansible",
    "drover",
    "lumen",
    "waygate",
    "palimpsest-client",
]

[tool.uv.sources]
kolla-ansible = { git = "https://opendev.org/openstack/kolla-ansible.git", rev = "34daacfbf2d5987f543787f57535b2bebe7dee19" }
lumen = { git = "https://github.com/openstack-afterglow/lumen.git", tag = "v0.3.0" }
waygate = { git = "https://github.com/openstack-afterglow/waygate.git", tag = "v0.1.4" }
palimpsest-client = { git = "https://github.com/openstack-afterglow/palimpsest.git", tag = "v0.2.3" }
drover = { git = "https://github.com/openstack-afterglow/drover.git", tag = "v0.2.24" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
