[project]
name = "afterglow-kolla-operator"
version = "0.1.0"
description = "Afterglow Kolla-Ansible operator environment specification"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "kolla-ansible",
    "drover",
    "lumen",
    "waygate",
    "palimpsest-local",
]

[tool.uv.sources]
kolla-ansible = { git = "https://opendev.org/openstack/kolla-ansible", rev = "34daacfbf2d5987f543787f57535b2bebe7dee19" }
drover = { git = "https://github.com/openstack-afterglow/drover", rev = "v0.2.21" }
lumen = { git = "https://github.com/openstack-afterglow/lumen", rev = "v0.2.1" }
waygate = { git = "https://github.com/openstack-afterglow/waygate", rev = "v0.1.2" }
palimpsest-local = { git = "https://github.com/openstack-afterglow/palimpsest", rev = "v0.1.3" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
