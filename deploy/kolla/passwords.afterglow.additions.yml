---
# Plugin Secret Additions for DMSLab Kolla-Ansible Deployment
# Place as /etc/kolla/config/afterglow/secrets.yml (mode 0600). The installer
# links this file into Kolla's globals.d loader; no `-e @...` argument is
# required for normal operations.
#
# NOTE: Do NOT duplicate stock Kolla credentials.
# Database admin (database_password) and Valkey master (valkey_master_password)
# are automatically inherited from Kolla's loaded passwords.yml.

# ── 1. MariaDB Service Schemas Passwords ─────────────────────────────────────
afterglow_database_password: ""
drover_database_password: ""
lumen_database_password: ""
waygate_database_password: ""
palimpsest_database_password: ""

# ── 2. Keystone Service Accounts Passwords ───────────────────────────────────
afterglow_admin_keystone_password: ""
drover_keystone_password: ""
lumen_keystone_password: ""
waygate_keystone_password: ""
palimpsest_keystone_password: ""

# ── 3. Application Security & Token Secrets ──────────────────────────────────
# FastAPI JWT / session signing secret (64 hex char)
# Generate: python3 -c "import secrets; print(secrets.token_hex(32))"
afterglow_secret_key: ""

# Shared 64-hex AES-256-GCM encryption key consumed by plugin services
# Generate: openssl rand -hex 32
afterglow_kubeconfig_encryption_key: ""

# Lumen content and provider-credential encryption key (exactly 64 hex).
# Existing deployments must copy their current Lumen key value here before cutover.
# Generate for new deployments: openssl rand -hex 32
lumen_encryption_key: ""

# Lumen internal MCP control plane service token (32+ byte hex)
# Generate: openssl rand -hex 32
afterglow_lumen_mcp_service_token: ""

# Shared token for internal K3s GPU admission endpoint (32+ byte hex)
# Generate: openssl rand -hex 32
afterglow_k3s_gpu_admission_token: ""
# Dedicated credential for Afterglow's internal K3s provisioning intent API.
# Generate: openssl rand -hex 32
afterglow_k3s_provisioning_token: ""
# Bundled mode password for the plugin-managed PostgreSQL container.
lumen_postgres_password: ""
# External mode URL, including the external PostgreSQL credential.
lumen_external_postgres_url: ""
# Optional semantic-memory PostgreSQL URL when lumen_enable_pgvector is true.
lumen_memory_pgvector_url: ""
