---
- name: Config | Resolve Afterglow service project ID
  become: true
  kolla_toolbox:
    container_engine: "{{ kolla_container_engine }}"
    module_name: openstack.cloud.project_info
    module_args:
      auth: "{{ openstack_auth }}"
      name: "{{ afterglow_effective_config.openstack.project_name }}"
  register: afterglow_service_project_lookup
  changed_when: false
  no_log: true
  when:
    - inventory_hostname in groups['afterglow']
    - afterglow_effective_config.openstack.service_project_id | length == 0

- name: Config | Set resolved native Afterglow service project ID
  ansible.builtin.set_fact:
    afterglow_service_project_id: "{{ afterglow_service_project_lookup.projects[0].id }}"
  no_log: true
  when:
    - inventory_hostname in groups['afterglow']
    - afterglow_effective_config.openstack.service_project_id | length == 0
    - afterglow_service_project_lookup.projects | default([]) | length == 1

- name: Config | Resolve Cloud Shell service project ID
  become: true
  kolla_toolbox:
    container_engine: "{{ kolla_container_engine }}"
    module_name: openstack.cloud.project_info
    module_args:
      auth: "{{ openstack_auth }}"
      name: "{{ afterglow_cloud_shell_project_name }}"
  register: afterglow_cloud_shell_project_lookup
  changed_when: false
  no_log: true
  when:
    - inventory_hostname in groups['afterglow']
    - afterglow_effective_config.services.cloud_shell | bool
    - afterglow_effective_config.cloud_shell.service_project_id | length == 0

- name: Config | Set resolved native Cloud Shell service project ID
  ansible.builtin.set_fact:
    afterglow_cloud_shell_project_id: "{{ afterglow_cloud_shell_project_lookup.projects[0].id }}"
  no_log: true
  when:
    - inventory_hostname in groups['afterglow']
    - afterglow_effective_config.services.cloud_shell | bool
    - afterglow_effective_config.cloud_shell.service_project_id | length == 0
    - afterglow_cloud_shell_project_lookup.projects | default([]) | length == 1

# Rebuild from current native inputs, not a previously merged/generated output.
# Operator keys remain authoritative after native project-ID discovery as well.
- name: Config | Refresh effective settings after project discovery
  ansible.builtin.include_tasks: effective_config.yml

- name: Config | Require resolved service project bindings
  ansible.builtin.assert:
    that:
      - afterglow_effective_config.openstack.service_project_id | length > 0
      - >-
        not (afterglow_effective_config.services.cloud_shell | bool) or
        (afterglow_effective_config.cloud_shell.service_project_id | length > 0 and
         afterglow_effective_config.cloud_shell.service_project_id != afterglow_effective_config.openstack.service_project_id)
    fail_msg: "Afterglow service project must resolve uniquely; enabled Cloud Shell requires a different dedicated project"
  no_log: true
  when: inventory_hostname in groups['afterglow']

- name: Config | Ensure private runtime directory exists
  become: true
  ansible.builtin.file:
    path: "{{ afterglow_runtime_config_dir }}"
    state: directory
    mode: "0750"
    owner: root
    group: root
  when: inventory_hostname in groups['afterglow']

- name: Config | Validate offline country database pin
  ansible.builtin.assert:
    that:
      - afterglow_traffic_analytics_geoip_mmdb_sha256 is match('^[a-f0-9]{64}$')
      - afterglow_traffic_analytics_geoip_mmdb_source is match('^/')
      - afterglow_traffic_analytics_geoip_mmdb_runtime_path is match('^/')
      - afterglow_traffic_analytics_geoip_mmdb_path is match('^/')
    fail_msg: "Configured offline country data requires absolute paths and a reviewed SHA-256 pin"
  run_once: true
  when: afterglow_traffic_analytics_geoip_mmdb_source | length > 0 or afterglow_traffic_analytics_geoip_mmdb_sha256 | length > 0

- name: Config | Inspect operator-owned offline country database
  become: false
  ansible.builtin.stat:
    path: "{{ afterglow_traffic_analytics_geoip_mmdb_source }}"
    follow: false
    get_checksum: true
    checksum_algorithm: sha256
  register: afterglow_country_database_stat
  run_once: true
  delegate_to: "{{ groups['deployment'][0] }}"
  when: afterglow_traffic_analytics_geoip_mmdb_source | length > 0

- name: Config | Verify complete offline country database input
  ansible.builtin.assert:
    that:
      - afterglow_country_database_stat.stat.isreg | default(false)
      - not (afterglow_country_database_stat.stat.islnk | default(false))
      - afterglow_country_database_stat.stat.readable | default(false)
      - afterglow_country_database_stat.stat.size | default(0) | int > 0
      - afterglow_country_database_stat.stat.size | default(0) | int <= 67108864
      - afterglow_country_database_stat.stat.checksum | default('') == afterglow_traffic_analytics_geoip_mmdb_sha256
    fail_msg: "Offline country database is unreadable, oversized, nonregular or does not match its reviewed pin"
  run_once: true
  when: afterglow_traffic_analytics_geoip_mmdb_source | length > 0

- name: Config | Install pinned offline country database read-only
  become: true
  ansible.builtin.copy:
    src: "{{ afterglow_traffic_analytics_geoip_mmdb_source }}"
    dest: "{{ afterglow_traffic_analytics_geoip_mmdb_runtime_path }}"
    owner: root
    group: root
    mode: "0644"
  when:
    - inventory_hostname in groups['afterglow']
    - afterglow_traffic_analytics_geoip_mmdb_source | length > 0

# All backend/frontend TOML parsing and public projection completed above.
# copy uses atomic replacement; malformed inputs never replace existing outputs.
- name: Config | Install effective backend configuration
  become: true
  ansible.builtin.copy:
    content: "{{ afterglow_effective_config_render.stdout }}\n"
    dest: "{{ afterglow_runtime_config_dir }}/{{ afterglow_generated_config_name }}"
    mode: "0640"
    owner: root
    group: root
  no_log: true
  when: inventory_hostname in groups['afterglow']

- name: Config | Install closed public frontend projection
  become: true
  ansible.builtin.copy:
    content: "{{ (afterglow_effective_frontend_projection.stdout | from_json).toml }}"
    dest: "{{ afterglow_runtime_config_dir }}/{{ afterglow_frontend_config_name }}"
    mode: "0644"
    owner: root
    group: root
  no_log: true
  when: inventory_hostname in groups['afterglow']

- name: Config | Remove obsolete generated override layers
  become: true
  ansible.builtin.file:
    path: "{{ afterglow_runtime_config_dir }}/{{ item }}"
    state: absent
  loop:
    - afterglow.operator.generated.conf
    - afterglow.frontend.operator.generated.conf
    - afterglow.zz-kolla.generated.conf
  when: inventory_hostname in groups['afterglow']

- name: Config | Ensure Afterglow log directories exist and are owned by log owner
  become: true
  community.docker.docker_container:
    name: afterglow_log_dir_setup
    image: "{{ afterglow_backend_image_ref }}"
    user: "root"
    command:
      - sh
      - -c
      - |
        mkdir -p /var/log/kolla/afterglow_api /var/log/kolla/afterglow && \
        chown -R {{ afterglow_log_owner_uid }}:{{ afterglow_log_owner_gid }} /var/log/kolla/afterglow_api /var/log/kolla/afterglow
    state: started
    detach: false
    cleanup: true
    volumes:
      - "kolla_logs:/var/log/kolla/"
  when: inventory_hostname in groups['afterglow']
