---
- name: Validate trusted Palimpsest BFF endpoint
  ansible.builtin.assert:
    that:
      - (afterglow_effective_config.services.palimpsest_internal_url | urlsplit('scheme')) == 'https'
      - (afterglow_effective_config.services.palimpsest_internal_url | urlsplit('hostname') | default('', true)) | length > 0
      - not (afterglow_effective_config.services.palimpsest_internal_url | urlsplit('username'))
      - not (afterglow_effective_config.services.palimpsest_internal_url | urlsplit('password'))
      - not (afterglow_effective_config.services.palimpsest_internal_url | urlsplit('query'))
      - not (afterglow_effective_config.services.palimpsest_internal_url | urlsplit('fragment'))
    fail_msg: "Effective services.palimpsest_internal_url must be a trusted HTTPS endpoint without credentials, query, or fragment"
  no_log: true
  when:
    - enable_afterglow | bool
    - afterglow_effective_config.services.palimpsest | bool
    - afterglow_effective_config.services.palimpsest_internal_url | default('') | length > 0
