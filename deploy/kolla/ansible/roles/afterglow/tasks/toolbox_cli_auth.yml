---
- name: Toolbox | Prepare cloud configuration directory
  become: true
  kolla_toolbox:
    container_engine: "{{ kolla_container_engine }}"
    user: root
    module_name: ansible.builtin.file
    module_args:
      path: /var/lib/ansible/.config/openstack
      state: directory
      owner: ansible
      group: ansible
      mode: "0700"
  run_once: true
  delegate_to: "{{ groups['afterglow'][0] }}"

- name: Toolbox | Merge the authenticated kolla cloud
  become: true
  community.docker.docker_container_exec:
    container: kolla_toolbox
    user: root
    argv:
      - python3
      - -c
      - "{{ lookup('ansible.builtin.file', 'merge_toolbox_clouds.py') }}"
    stdin: "{{ {'name': 'kolla', 'entry': {'auth': openstack_auth, 'auth_type': 'password', 'region_name': openstack_region_name, 'interface': openstack_interface}} | to_json }}"
    stdin_add_newline: false
  register: afterglow_toolbox_cloud_config
  changed_when: afterglow_toolbox_cloud_config.stdout == 'changed'
  failed_when: afterglow_toolbox_cloud_config.rc != 0
  no_log: true
  run_once: true
  delegate_to: "{{ groups['afterglow'][0] }}"
