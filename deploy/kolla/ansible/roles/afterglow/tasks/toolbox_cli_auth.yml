---
- name: Toolbox | Prepare cloud configuration directory
  become: true
  kolla_toolbox:
    container_engine: "{{ kolla_container_engine }}"
    user: root
    module_name: ansible.builtin.file
    module_args:
      path: /var/lib/ansible/.config/openstack
      state: directory
      owner: ansible
      group: ansible
      mode: "0700"
  run_once: true
  delegate_to: "{{ groups['afterglow'][0] }}"

- name: Toolbox | Configure authenticated cloud
  become: true
  community.docker.docker_container_exec:
    container: kolla_toolbox
    user: root
    argv:
      - python3
      - -c
      - |
        import os, pwd, stat, sys, tempfile
        path = '/var/lib/ansible/.config/openstack/clouds.yaml'
        data = sys.stdin.buffer.read()
        user = pwd.getpwnam('ansible')
        try:
            st = os.lstat(path)
        except FileNotFoundError:
            st = None
        if st and not stat.S_ISREG(st.st_mode):
            raise RuntimeError('cloud configuration must be a regular file')
        if st and st.st_uid == user.pw_uid and st.st_gid == user.pw_gid and stat.S_IMODE(st.st_mode) == 0o600 and open(path, 'rb').read() == data:
            print('unchanged')
        else:
            fd, temporary = tempfile.mkstemp(prefix='.clouds.', dir=os.path.dirname(path))
            try:
                with os.fdopen(fd, 'wb') as out:
                    os.fchmod(out.fileno(), 0o600)
                    os.fchown(out.fileno(), user.pw_uid, user.pw_gid)
                    out.write(data)
                os.replace(temporary, path)
            finally:
                if os.path.exists(temporary):
                    os.unlink(temporary)
            print('changed')
    stdin: "{{ {'clouds': {'kolla': {'auth': openstack_auth, 'auth_type': 'password', 'region_name': openstack_region_name, 'interface': openstack_interface}}} | to_json }}"
    stdin_add_newline: false
  register: afterglow_toolbox_cloud_config
  changed_when: afterglow_toolbox_cloud_config.stdout == 'changed'
  failed_when: afterglow_toolbox_cloud_config.rc != 0
  no_log: true
  run_once: true
  delegate_to: "{{ groups['afterglow'][0] }}"
