---
- name: Secrets | Verify effective app secret key
  ansible.builtin.assert:
    that:
      - afterglow_effective_config.app.secret_key | length >= 32
    fail_msg: "Effective app.secret_key must be at least 32 characters (64-char hex recommended)"
  no_log: true
  run_once: true

- name: Secrets | Verify effective kubeconfig encryption key
  ansible.builtin.assert:
    that:
      - afterglow_effective_config.k3s.kubeconfig_encryption_key | length >= 32
    fail_msg: "Effective k3s.kubeconfig_encryption_key must be at least 32 characters"
  no_log: true
  run_once: true
  when: afterglow_effective_config.services.k3s | bool

- name: Secrets | Verify K3s GPU admission credential
  ansible.builtin.assert:
    that:
      - afterglow_effective_config.k3s.gpu_admission_token | length >= 32
    fail_msg: "Effective k3s.gpu_admission_token must be at least 32 characters"
  no_log: true
  run_once: true
  when: afterglow_effective_config.services.k3s | bool

- name: Secrets | Verify effective Keystone service password
  ansible.builtin.assert:
    that:
      - afterglow_effective_config.openstack.password | length > 0
    fail_msg: "Effective openstack.password must be set in the protected configuration"
  no_log: true
  run_once: true


- name: Secrets | Verify Lumen MCP bridge credential
  ansible.builtin.assert:
    that:
      - (afterglow_effective_config.mcp | default({})).get('lumen_service_token', '') | length >= 32
    fail_msg: "Effective mcp.lumen_service_token must be at least 32 characters when Lumen MCP is enabled"
  no_log: true
  run_once: true
  when:
    - afterglow_effective_config.services.mcp | bool
    - enable_lumen | default(false) | bool