---
- name: Secrets | Verify afterglow_database_password is not empty
  ansible.builtin.assert:
    that:
      - afterglow_database_password is defined
      - afterglow_database_password | length > 0
    fail_msg: "afterglow_database_password must be set in passwords.yml"
  run_once: true

- name: Secrets | Verify afterglow_secret_key is not empty
  ansible.builtin.assert:
    that:
      - afterglow_secret_key is defined
      - afterglow_secret_key | length >= 32
    fail_msg: "afterglow_secret_key must be at least 32 characters (64-char hex recommended)"
  run_once: true

- name: Secrets | Verify afterglow_kubeconfig_encryption_key
  ansible.builtin.assert:
    that:
      - afterglow_kubeconfig_encryption_key is defined
      - afterglow_kubeconfig_encryption_key | length >= 32
    fail_msg: "afterglow_kubeconfig_encryption_key must be at least 32 characters"
  run_once: true
  when: afterglow_service_k3s_enabled | bool

- name: Secrets | Verify K3s internal API credentials
  ansible.builtin.assert:
    that:
      - afterglow_k3s_gpu_admission_token | length >= 32
      - afterglow_k3s_provisioning_token | length >= 32
    fail_msg: "K3s GPU admission and provisioning tokens must each be at least 32 characters"
  run_once: true
  when: afterglow_service_k3s_enabled | bool

- name: Secrets | Verify afterglow_admin_keystone_password
  ansible.builtin.assert:
    that:
      - afterglow_admin_keystone_password is defined
      - afterglow_admin_keystone_password | length > 0
    fail_msg: "afterglow_admin_keystone_password must be set in passwords.yml"
  run_once: true


- name: Secrets | Verify Lumen MCP bridge credential
  ansible.builtin.assert:
    that:
      - afterglow_lumen_mcp_service_token is defined
      - afterglow_lumen_mcp_service_token | length >= 32
    fail_msg: "afterglow_lumen_mcp_service_token must be at least 32 characters when Lumen MCP is enabled"
  run_once: true
  when:
    - afterglow_service_mcp_enabled | bool
    - enable_lumen | default(false) | bool