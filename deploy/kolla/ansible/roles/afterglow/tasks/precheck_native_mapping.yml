---
# The pin is derived from the Kolla mapping source. Before any restart, the live
# Keystone mapping must be the same document, or login would fail closed later.
- name: Native mapping precheck | Derive pins from the Kolla mapping source
  become: false
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - -c
      - "{{ lookup('ansible.builtin.file', role_path ~ '/files/render_effective_config.py') }}"
      - --native-pins
    stdin: "{{ afterglow_effective_config | to_json }}"
  register: afterglow_native_pins_out
  delegate_to: "{{ groups['deployment'][0] }}"
  changed_when: false
  check_mode: false
  run_once: true
  no_log: true

- name: Native mapping precheck | Read the live Keystone mapping
  become: true
  community.docker.docker_container_exec:
    container: kolla_toolbox
    command: >-
      openstack --os-cloud=kolla mapping show {{ item.mapping_id | quote }} -f json
  loop: "{{ afterglow_native_pins_out.stdout | from_json }}"
  register: afterglow_native_live
  changed_when: false
  run_once: true
  no_log: true
  delegate_to: "{{ groups['afterglow'][0] }}"
  when: afterglow_native_pins_out.stdout | from_json | length > 0

- name: Native mapping precheck | Derive the digest of each live mapping
  become: false
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - -c
      - "{{ lookup('ansible.builtin.file', role_path ~ '/files/render_effective_config.py') }}"
      - --mapping-digest
    stdin: "{{ item.stdout | from_json | to_json }}"
  loop: "{{ afterglow_native_live.results | default([]) }}"
  register: afterglow_native_digests
  changed_when: false
  check_mode: false
  run_once: true
  no_log: true
  delegate_to: "{{ groups['deployment'][0] }}"

- name: Native mapping precheck | Require live mappings to match their derived pins
  ansible.builtin.assert:
    that:
      - afterglow_native_digests.results | map(attribute='stdout') | list == afterglow_native_pins_out.stdout | from_json | map(attribute='sha256') | list
    fail_msg: "Live Keystone mapping differs from the Kolla mapping source it pins; reconcile the mapping source and Keystone before reconfigure"
  run_once: true
  when: afterglow_native_pins_out.stdout | from_json | length > 0
