---
- name: Manila | Ensure toolbox has the Manila CLI plugin
  become: true
  kolla_toolbox:
    container_engine: "{{ kolla_container_engine }}"
    user: root
    module_name: ansible.builtin.pip
    module_args:
      name: "python-manilaclient=={{ afterglow_manila_client_version }}"
      executable: /opt/ansible/bin/pip
  run_once: true
  delegate_to: "{{ groups['afterglow'][0] }}"
