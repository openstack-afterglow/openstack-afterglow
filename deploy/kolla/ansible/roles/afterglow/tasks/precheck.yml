---
- name: Precheck | Verify enable_afterglow is set
  ansible.builtin.assert:
    that:
      - enable_afterglow is defined
    fail_msg: "enable_afterglow must be set in globals.yml"
  run_once: true
  tags: precheck

- name: Precheck | Verify stock Kolla Valkey dependency
  ansible.builtin.assert:
    that:
      - enable_valkey | default(false) | bool
      - groups.get('valkey', []) | length > 0
      - valkey_master_password is defined and valkey_master_password | length > 0
    fail_msg: "Deploy stock Kolla Valkey before enabling afterglow; no plugin Redis fallback exists"
  run_once: true
  tags: precheck
  when: enable_afterglow | default(false) | bool

- name: Precheck | Check required password variables
  ansible.builtin.assert:
    that:
      - afterglow_database_password is defined and afterglow_database_password | length > 0
      - afterglow_secret_key is defined and afterglow_secret_key | length > 0
      - afterglow_admin_keystone_password is defined and afterglow_admin_keystone_password | length > 0
      - afterglow_kubeconfig_encryption_key is defined and afterglow_kubeconfig_encryption_key | length > 0
    fail_msg: "Required afterglow passwords are not set. Add them to passwords.yml from passwords.afterglow.additions.yml"
  run_once: true
  tags: precheck
  when: enable_afterglow | bool

- name: Precheck | Verify K3s internal API credentials
  ansible.builtin.assert:
    that:
      - afterglow_k3s_gpu_admission_token | length >= 32
      - afterglow_k3s_provisioning_token | length >= 32
    fail_msg: "K3s GPU admission and provisioning tokens must each be at least 32 characters in secrets.yml"
  run_once: true
  tags: precheck
  when:
    - enable_afterglow | bool
    - afterglow_service_k3s_enabled | bool

- name: Precheck | Validate Afterglow public frontend origin
  ansible.builtin.assert:
    that:
      - afterglow_public_endpoint_url is match('^https?://[^/?#\s]+/?$')
    fail_msg: "afterglow_public_endpoint_url must be an absolute HTTP(S) origin without a path, query, or fragment"
  run_once: true
  tags: precheck
  when: enable_afterglow | bool

- name: Precheck | Validate Kolla public route hostname
  ansible.builtin.assert:
    that:
      - afterglow_public_haproxy_fqdn is match('^[A-Za-z0-9][A-Za-z0-9.-]*[A-Za-z0-9]$')
      - afterglow_public_haproxy_router_port | int > 0
      - afterglow_public_haproxy_router_port | int < 65536
    fail_msg: "afterglow_public_haproxy_fqdn must be a hostname and afterglow_public_haproxy_router_port must be a valid TCP port"
  run_once: true
  tags: precheck
  when:
    - enable_afterglow | bool
    - afterglow_public_haproxy_enabled | bool

- name: Precheck | Prepare Manila CLI authentication
  ansible.builtin.include_tasks: manila_cli_auth.yml
  when: enable_afterglow | bool and afterglow_service_manila_enabled | bool
  tags: precheck

- name: Precheck | Verify Manila microversion support
  become: true
  community.docker.docker_container_exec:
    container: kolla_toolbox
    command: >-
      openstack --os-cloud=kolla --os-share-api-version={{ afterglow_manila_microversion }}
      share list --limit 1 -f json
  register: manila_version_check
  failed_when: false
  run_once: true
  delegate_to: "{{ groups['afterglow'][0] }}"
  tags: precheck
  when: enable_afterglow | bool and afterglow_service_manila_enabled | bool

- name: Precheck | Fail if Manila microversion not supported
  ansible.builtin.fail:
    msg: "Manila authenticated API check failed: {{ manila_version_check.stderr | default('', true) }} {{ manila_version_check.stdout | default('', true) }} {{ manila_version_check.msg | default('', true) }}"
  when:
    - enable_afterglow | bool
    - afterglow_service_manila_enabled | bool
    - manila_version_check is defined
    - manila_version_check.rc | default(1) != 0
  run_once: true
  tags: precheck

- name: Precheck | Check Ceph monitors reachability
  ansible.builtin.assert:
    that:
      - afterglow_ceph_monitors | length > 0
    fail_msg: "afterglow_ceph_monitors must be set (e.g. '10.0.0.1:6789,10.0.0.2:6789')"
  run_once: true
  tags: precheck
  when: enable_afterglow | bool and afterglow_service_manila_enabled | bool

- name: Precheck | Inspect enabled remote Afterglow image manifests
  become: true
  ansible.builtin.command:
    argv:
      - docker
      - manifest
      - inspect
      - "{{ item.value.image }}"
  register: image_checks
  failed_when: false
  changed_when: false
  no_log: true
  loop: "{{ afterglow_services | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  run_once: true
  delegate_to: "{{ groups['afterglow'] | first }}"
  tags: precheck
  when:
    - enable_afterglow | bool
    - item.value.enabled | bool
    - not (afterglow_source_mode | default(false) | bool)

- name: Precheck | Fail if any configured Afterglow image is inaccessible
  ansible.builtin.assert:
    that:
      - item.rc == 0
    fail_msg: "Cannot access configured Afterglow image reference. Ensure GHCR credentials are configured."
  no_log: true
  loop: "{{ image_checks.results | default([]) }}"
  loop_control:
    label: "{{ item.item.key | default('image') }}"
  run_once: true
  tags: precheck
  when:
    - enable_afterglow | bool
    - not (afterglow_source_mode | default(false) | bool)
    - image_checks is defined
    - not (item.skipped | default(false) | bool)
