---
- name: Bootstrap | Initialize tables and verify SQL106 migration
  become: true
  community.docker.docker_container:
    name: afterglow_bootstrap
    image: "{{ afterglow_backend_image_ref }}"
    command:
      - python
      - -m
      - scripts.bootstrap_schema
    state: started
    detach: false
    network_mode: host
    groups: ["0"]
    cleanup: true
    volumes:
      - "{{ afterglow_runtime_config_dir }}/{{ afterglow_generated_config_name }}:/app/afterglow.conf:ro"
  no_log: true
  run_once: true
  delegate_to: "{{ groups['afterglow'] | first }}"
  when: afterglow_effective_config.database.url | length > 0

- name: Bootstrap | Show bootstrap output
  ansible.builtin.debug:
    msg: "Afterglow database bootstrap completed successfully"
  run_once: true
  when: afterglow_effective_config.database.url | length > 0
