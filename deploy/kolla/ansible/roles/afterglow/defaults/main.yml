---
# Afterglow kolla role defaults

# ── 이미지 및 소스 빌드 ────────────────────────────────────────────────────────
afterglow_image_namespace: "ghcr.io/openstack-afterglow"
afterglow_image_tag: "latest"
afterglow_backend_image: "{{ afterglow_image_namespace }}/afterglow-api"
afterglow_frontend_image: "{{ afterglow_image_namespace }}/afterglow"
# Notion integration worker image
afterglow_worker_image: "{{ afterglow_image_namespace }}/afterglow-worker"

enable_afterglow_source_build: false
afterglow_source_mode: "{{ enable_afterglow_source_build | default(false) | bool }}"
afterglow_source_repo: "https://github.com/openstack-afterglow/openstack-afterglow.git"
afterglow_source_version: "dev"
afterglow_source_dir: "{{ afterglow_source_checkout_path | default('/opt/afterglow/src/openstack-afterglow') }}"
afterglow_backend_image_ref: "{{ 'afterglow-local/backend:' ~ (afterglow_source_version | truncate(12, True, '')) if (afterglow_source_mode | bool) else (afterglow_backend_image ~ ':' ~ afterglow_image_tag) }}"
afterglow_frontend_image_ref: "{{ 'afterglow-local/frontend:' ~ (afterglow_source_version | truncate(12, True, '')) if (afterglow_source_mode | bool) else (afterglow_frontend_image ~ ':' ~ afterglow_image_tag) }}"
afterglow_worker_image_ref: "{{ 'afterglow-local/worker:' ~ (afterglow_source_version | truncate(12, True, '')) if (afterglow_source_mode | bool) else (afterglow_worker_image ~ ':' ~ afterglow_image_tag) }}"

# ── 토글 (DMSLab 기본: backend/frontend만 활성화) ────────────────────────────
enable_afterglow: "no"
enable_afterglow_backend: "{{ enable_afterglow }}"
enable_afterglow_frontend: "{{ enable_afterglow }}"
enable_afterglow_notion_worker: "no"

# ── 사전조건 실행 여부 ────────────────────────────────────────────────────────
afterglow_run_preconditions: true

# ── 설정 디렉토리 ────────────────────────────────────────────────────────────
# Kolla's custom service directory is the authoritative operator input tree.
# Backend and frontend inputs stay separate; generated runtime layers use
# distinct names under a private subdirectory so all-in-one deployments never
# overwrite operator-owned source files.
afterglow_config_dir: "{{ node_custom_config }}/afterglow"
afterglow_runtime_config_dir: "{{ afterglow_config_dir }}/generated"
afterglow_operator_config_source: "{{ afterglow_config_dir }}/backend/afterglow.conf"
afterglow_operator_frontend_config_source: "{{ afterglow_config_dir }}/frontend/afterglow.conf"
afterglow_generated_config_name: "afterglow.generated.conf"
afterglow_operator_config_name: "afterglow.operator.generated.conf"
afterglow_kolla_config_name: "afterglow.zz-kolla.generated.conf"
afterglow_operator_config_staging_path: "/tmp/{{ afterglow_operator_config_name }}.sanitized"
afterglow_operator_frontend_config_name: "afterglow.frontend.operator.generated.conf"
afterglow_operator_frontend_config_staging_path: "/tmp/{{ afterglow_operator_frontend_config_name }}.projected"
afterglow_frontend_config_name: "afterglow.frontend.generated.conf"

# ── 로그 디렉토리 소유권 ──────────────────────────────────────────────────────
afterglow_log_owner_uid: 1000
afterglow_log_owner_gid: 1000

# ── 포트 ──────────────────────────────────────────────────────────────────────
afterglow_backend_port: 8000
afterglow_frontend_port: 3080
# Kolla HAProxy owns the VIP listeners. Application containers bind each
# controller's API address on private upstream ports.
afterglow_backend_listen_address: "{{ 'api' | kolla_address(inventory_hostname) }}"
afterglow_frontend_listen_address: "{{ 'api' | kolla_address(inventory_hostname) }}"
afterglow_backend_listen_port: 18000
afterglow_frontend_listen_port: 18081

# ── URL 및 엔드포인트 ────────────────────────────────────────────────────────
afterglow_public_api_base: "{{ internal_protocol | default('http') }}://{{ kolla_internal_fqdn | default(kolla_internal_vip_address) }}:{{ afterglow_backend_port }}"
afterglow_openstack_interface: "{{ openstack_interface | default('internal') }}"
afterglow_public_endpoint_url: "{{ public_protocol | default('https') }}://{{ kolla_external_fqdn | default('localhost') }}"
# Optional Kolla external-VIP route. The plugin-owned fragment receives the
# public host and dispatches /api/ to the API backend and all other paths to
# the frontend backend without modifying Kolla's stock HAProxy templates.
afterglow_public_haproxy_enabled: false
afterglow_public_haproxy_fqdn: ""
afterglow_public_haproxy_router_port: 18082

# ── DB / Valkey 캐시 ──────────────────────────────────────────────────────────
# Kolla-owned MariaDB topology and administrative credentials. The service
# schema user/password remain plugin secrets.
afterglow_database_address: "{{ database_address }}"
afterglow_database_port: "{{ database_port }}"
afterglow_database_admin_user: "{{ database_user }}"
afterglow_database_admin_password: "{{ database_password }}"
afterglow_database_name: "afterglow"
afterglow_database_user: "afterglow"
afterglow_database_url: "mysql+aiomysql://{{ afterglow_database_user }}:{{ afterglow_database_password }}@{{ afterglow_database_address }}:{{ afterglow_database_port }}/{{ afterglow_database_name }}"

afterglow_valkey_host: "{{ 'api' | kolla_address(groups['valkey'][0]) }}"
afterglow_valkey_port: "{{ valkey_server_port }}"
afterglow_valkey_password: "{{ valkey_master_password | default('') }}"
afterglow_redis_db_index: 5
afterglow_redis_url: "redis://default:{{ afterglow_valkey_password }}@{{ afterglow_valkey_host }}:{{ afterglow_valkey_port }}/{{ afterglow_redis_db_index }}"
afterglow_sentinel_enabled: true
afterglow_sentinel_master_name: "{{ valkey_sentinel_monitor_name }}"
afterglow_sentinel_hosts: "{% for host in groups['valkey'] %}{{ 'api' | kolla_address(host) }}:{{ valkey_sentinel_port }}{{ ',' if not loop.last else '' }}{% endfor %}"

# ── Keystone ──────────────────────────────────────────────────────────────────
afterglow_admin_keystone_user: "afterglow_admin"
afterglow_service_project_name: "afterglow-service"
afterglow_service_project_id: ""  # preconditions_keystone에서 자동 채워짐
afterglow_keystone_auth_url: "{{ keystone_internal_url }}"
afterglow_keystone_project_domain_name: "{{ default_project_domain_name }}"
afterglow_keystone_user_domain_name: "{{ default_user_domain_name }}"
afterglow_keystone_region_name: "{{ openstack_region_name }}"
afterglow_keystone_interface: "{{ afterglow_openstack_interface }}"
afterglow_openstack_insecure: "{{ openstack_insecure | default(false) }}"
afterglow_openstack_cacert: "{{ openstack_cacert | default('') }}"

# ── Manila ────────────────────────────────────────────────────────────────────
afterglow_manila_microversion: "2.65"
afterglow_manila_client_version: "6.0.0"
afterglow_manila_share_type: "cephfs"
afterglow_ceph_monitors: ""
# Manila expects the CephX ID without the "client." entity prefix.
afterglow_cephx_user: "afterglow"
afterglow_manila_shares:
  layer_store_rw:
    name: layer-store-rw
    size_gb: 100
    protocol: CEPHFS
    access_level: rw
  layer_store_ro:
    name: layer-store-ro
    size_gb: 100
    protocol: CEPHFS
    access_level: ro
  manifest_store:
    name: manifest-store
    size_gb: 10
    protocol: CEPHFS
    access_level: rw
  metadata_store:
    name: metadata-store
    size_gb: 10
    protocol: CEPHFS
    access_level: rw

# share ID (preconditions_manila에서 자동 채워짐)
afterglow_share_layer_store_rw_id: ""
afterglow_share_layer_store_ro_id: ""
afterglow_share_manifest_store_id: ""
afterglow_share_metadata_store_id: ""

# ── Instance health ───────────────────────────────────────────────────────────
afterglow_instance_health_callback_base_url: "{{ afterglow_public_endpoint_url }}"

# ── 통합 서비스 토글 (DMSLab 기본: k3s, waygate, chat, mcp 활성화) ────────────
afterglow_service_manila_enabled: false
afterglow_service_swift_enabled: false
afterglow_service_k3s_enabled: true
afterglow_service_zun_enabled: false
afterglow_service_trove_enabled: false
afterglow_service_magnum_enabled: false
afterglow_service_barbican_enabled: false
afterglow_service_waygate_enabled: true
afterglow_service_palimpsest_enabled: false
afterglow_service_chat_enabled: true
afterglow_service_mcp_enabled: true
# Shared only with the Lumen workload for the internal delegated-MCP bridge.
afterglow_lumen_mcp_service_token: ""
# K3s internal API credentials remain empty until supplied by the operator
# secrets layer. Prechecks reject empty values before any container restart.
afterglow_k3s_gpu_admission_token: ""
afterglow_k3s_provisioning_token: ""

# ── GHCR imagePullSecret ──────────────────────────────────────────────────────
afterglow_image_pull_secret_b64: ""

# ── afterglow_services dict (kolla_docker 루프 대상) ──────────────────────────
afterglow_services:
  afterglow-backend:
    container_name: afterglow_backend
    group: afterglow
    enabled: "{{ enable_afterglow_backend | bool }}"
    image: "{{ afterglow_backend_image_ref }}"
    network_mode: host
    command: ["uvicorn", "app.main:app", "--host", "{{ afterglow_backend_listen_address }}", "--port", "{{ afterglow_backend_listen_port | string }}"]
    restart_policy: unless-stopped
    groups: ["0"]
    volumes:
      - "{{ afterglow_runtime_config_dir }}/{{ afterglow_generated_config_name }}:/app/afterglow.conf:ro"
      - "{{ afterglow_runtime_config_dir }}/{{ afterglow_operator_config_name }}:/app/{{ afterglow_operator_config_name }}:ro"
      - "{{ afterglow_runtime_config_dir }}/{{ afterglow_kolla_config_name }}:/app/{{ afterglow_kolla_config_name }}:ro"
      - "kolla_logs:/var/log/kolla/"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; response = urlopen('http://{{ afterglow_backend_listen_address }}:{{ afterglow_backend_listen_port }}/api/v1/health', timeout=5); assert response.status == 200"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    haproxy:
      afterglow-api:
        enabled: "{{ enable_afterglow_backend | bool }}"
        external: false
        port: "{{ afterglow_backend_port }}"
        listen_port: "{{ afterglow_backend_listen_port }}"
        host_group: afterglow
        frontend_http_extra:
          - "option forwardfor"
        backend_http_extra:
          - "option httpchk GET /api/v1/health"
          - "http-check expect status 200"
  afterglow-frontend:
    container_name: afterglow_frontend
    group: afterglow
    enabled: "{{ enable_afterglow_frontend | bool }}"
    image: "{{ afterglow_frontend_image_ref }}"
    network_mode: host
    command: ["node", "scripts/run-with-file-log.mjs", "node", "build"]
    restart_policy: unless-stopped
    volumes:
      - "{{ afterglow_runtime_config_dir }}/{{ afterglow_frontend_config_name }}:/app/afterglow.conf:ro"
      - "kolla_logs:/var/log/kolla/"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://{{ afterglow_frontend_listen_address }}:{{ afterglow_frontend_listen_port }}/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    haproxy:
      afterglow-frontend:
        enabled: "{{ enable_afterglow_frontend | bool }}"
        external: false
        port: "{{ afterglow_frontend_port }}"
        listen_port: "{{ afterglow_frontend_listen_port }}"
        host_group: afterglow
        frontend_http_extra:
          - "option forwardfor"
        backend_http_extra:
          - "option httpchk GET /"
          - "http-check expect status 200"
  afterglow-notion-worker:
    container_name: afterglow_notion_worker
    group: afterglow
    enabled: "{{ enable_afterglow_notion_worker | bool }}"
    image: "{{ afterglow_worker_image_ref }}"
    command: ["python", "-m", "app.notion_worker"]
    network_mode: host
    restart_policy: unless-stopped
    groups: ["0"]
    volumes:
      - "{{ afterglow_runtime_config_dir }}/{{ afterglow_generated_config_name }}:/app/afterglow.conf:ro"
      - "{{ afterglow_runtime_config_dir }}/{{ afterglow_operator_config_name }}:/app/{{ afterglow_operator_config_name }}:ro"
      - "{{ afterglow_runtime_config_dir }}/{{ afterglow_kolla_config_name }}:/app/{{ afterglow_kolla_config_name }}:ro"
      - "kolla_logs:/var/log/kolla/"


# Keep runtime environments outside afterglow_services. Kolla's generic
# HAProxy tasks print service-map items, so embedding credentials there would
# expose them in normal Ansible output.
afterglow_service_environments:
  afterglow-backend:
    DATABASE_URL: "{{ afterglow_database_url }}"
    REDIS_URL: "{{ afterglow_redis_url }}"
    OS_PASSWORD: "{{ afterglow_admin_keystone_password }}"
    OS_INTERFACE: "{{ afterglow_openstack_interface }}"
    SECRET_KEY: "{{ afterglow_secret_key }}"
    PUBLIC_API_BASE: "{{ afterglow_public_api_base }}"
    ORIGIN: "{{ afterglow_public_endpoint_url }}"
    K3S_KUBECONFIG_ENCRYPTION_KEY: "{{ afterglow_kubeconfig_encryption_key }}"
    K3S_GPU_ADMISSION_TOKEN: "{{ afterglow_k3s_gpu_admission_token }}"
    K3S_PROVISIONING_TOKEN: "{{ afterglow_k3s_provisioning_token }}"
    LUMEN_MCP_SERVICE_TOKEN: "{{ afterglow_lumen_mcp_service_token }}"
    OS_SERVICE_PROJECT_ID: "{{ afterglow_service_project_id }}"
    UNION_LAYER_STORE_RW_SHARE_ID: "{{ afterglow_share_layer_store_rw_id }}"
    UNION_LAYER_STORE_RO_SHARE_ID: "{{ afterglow_share_layer_store_ro_id }}"
    UNION_MANIFEST_STORE_SHARE_ID: "{{ afterglow_share_manifest_store_id }}"
    UNION_METADATA_STORE_SHARE_ID: "{{ afterglow_share_metadata_store_id }}"
  afterglow-frontend:
    ORIGIN: "{{ afterglow_public_endpoint_url }}"
    PUBLIC_API_BASE: "{{ afterglow_public_api_base }}"
    HOST: "{{ afterglow_frontend_listen_address }}"
    PORT: "{{ afterglow_frontend_listen_port | string }}"
    LOG_DIRECTORY: "/var/log/kolla/afterglow"
    LOG_MAX_BYTES: "52428800"
  afterglow-notion-worker:
    DATABASE_URL: "{{ afterglow_database_url }}"
    REDIS_URL: "{{ afterglow_redis_url }}"
    OS_PASSWORD: "{{ afterglow_admin_keystone_password }}"
    OS_INTERFACE: "{{ afterglow_openstack_interface }}"
    K3S_KUBECONFIG_ENCRYPTION_KEY: "{{ afterglow_kubeconfig_encryption_key }}"
    K3S_GPU_ADMISSION_TOKEN: "{{ afterglow_k3s_gpu_admission_token }}"
    K3S_PROVISIONING_TOKEN: "{{ afterglow_k3s_provisioning_token }}"
# Kolla's external frontend map selects one backend per host. This synthetic
# service supplies that backend; it is never passed to the container start loop.
afterglow_public_haproxy_services:
  afterglow-public:
    group: afterglow
    enabled: "{{ enable_afterglow | bool and afterglow_public_haproxy_enabled | bool }}"
    haproxy:
      afterglow-public:
        enabled: "{{ enable_afterglow | bool and afterglow_public_haproxy_enabled | bool }}"
        external: true
        external_fqdn: "{{ afterglow_public_haproxy_fqdn }}"
        mode: http
        with_frontend: true
        with_backend: true

afterglow_haproxy_services: "{{ afterglow_services | combine(afterglow_public_haproxy_services, recursive=True) }}"