apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: afterglow
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: 'afterglow-api'
        static_configs:
          - targets: ['backend:8000']
        metrics_path: '/api/v1/metrics'

      # VM node_exporter (port 9100) — http_sd로 타깃 자동 갱신
      - job_name: 'instances-node'
        scrape_interval: 30s
        metrics_path: /metrics
        http_sd_configs:
          - url: 'http://backend:8000/api/v1/sd/prometheus/targets'
            authorization:
              type: Bearer
              credentials_file: /etc/prometheus/sd-token
            refresh_interval: 60s
        relabel_configs:
          # job="node_exporter" label이 붙은 타깃만 유지
          - source_labels: [job]
            regex: 'node_exporter'
            action: keep
          # instance label을 __address__로 설정 (VM 이름 대신 ip:port 사용)
          - source_labels: [__address__]
            target_label: instance

      # GPU VM dcgm_exporter (port 9400) — 같은 sd endpoint에서 dcgm 타깃만 필터
      - job_name: 'instances-dcgm'
        scrape_interval: 30s
        metrics_path: /metrics
        http_sd_configs:
          - url: 'http://backend:8000/api/v1/sd/prometheus/targets'
            authorization:
              type: Bearer
              credentials_file: /etc/prometheus/sd-token
            refresh_interval: 60s
        relabel_configs:
          - source_labels: [job]
            regex: 'dcgm_exporter'
            action: keep
          - source_labels: [__address__]
            target_label: instance

      # compute 노드의 libvirt_exporter — VM 내부 node_exporter 미설치 인스턴스도 커버
      # kolla: enable_prometheus_libvirt_exporter: "yes" 설정 후 kolla-ansible reconfigure -t prometheus 필요
      - job_name: 'instances-libvirt'
        scrape_interval: 30s
        metrics_path: /metrics
        http_sd_configs:
          - url: 'http://backend:8000/api/v1/sd/prometheus/libvirt-targets'
            authorization:
              type: Bearer
              credentials_file: /etc/prometheus/sd-token
            refresh_interval: 60s
        relabel_configs:
          - source_labels: [__address__]
            target_label: instance
