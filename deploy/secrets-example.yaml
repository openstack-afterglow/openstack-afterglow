# =============================================================================
# Afterglow 시크릿 예시 — 절대 git에 커밋하지 마세요
# 배포 서버에 secrets-dev.yaml 또는 secrets-prod.yaml 로 저장
#
#   helm upgrade --install afterglow-dev \
#     oci://ghcr.io/openstack-afterglow/charts/afterglow \
#     --version 1.15.2 \
#     -f values-dev.yaml \
#     -f secrets-dev.yaml \
#     --namespace afterglow-dev --create-namespace
# =============================================================================

secrets:
  # OpenStack 관리자 비밀번호
  osPassword: "CHANGE_ME"

  # FastAPI JWT 서명 키 — 최소 32자 랜덤 문자열
  # 생성: python3 -c "import secrets; print(secrets.token_hex(32))"
  secretKey: "CHANGE_ME_32_CHARS_MIN"

  # k3s kubeconfig AES-256-GCM 암호화 키 — 32바이트 hex
  # 생성: python3 -c "import secrets; print(secrets.token_hex(32))"
  k3sKubeconfigEncryptionKey: "CHANGE_ME_64_HEX_CHARS"

  # DB 연결 URL (aiomysql)
  # 형식: mysql+aiomysql://user:password@host:3306/dbname
  databaseUrl: "mysql+aiomysql://afterglow:CHANGE_ME@127.0.0.1:3306/afterglow"

  # Prometheus Basic Auth 비밀번호
  prometheusPassword: "CHANGE_ME"

  # 모니터링 서비스 디스커버리 토큰 (미사용 시 빈 문자열)
  monitoringSDToken: ""

  # Notion 설정 암호화 키 (미사용 시 빈 문자열)
  notionConfigEncryptionKey: ""

  # SMTP 비밀번호 (Gmail 앱 비밀번호 또는 SMTP 서버 비밀번호)
  smtpPassword: "CHANGE_ME"

  # Builder SSH 개인키 — PEM 형식 블록 스칼라
  # 생성: ssh-keygen -t ed25519 -C "afterglow-builder" -f builder.key
  builderSshPrivateKey: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    PASTE_YOUR_PRIVATE_KEY_HERE
    -----END OPENSSH PRIVATE KEY-----

  # Grafana 관리자 비밀번호
  grafanaAdminPassword: "CHANGE_ME"
