apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Operator-provisioned afterglow-country-data PVC contains pinned country.mmdb.
# Provision read access for all backend replicas; no downloads or writable mounts.
resources:
  - ../prod
patches:
  - path: backend-volume.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: backend
