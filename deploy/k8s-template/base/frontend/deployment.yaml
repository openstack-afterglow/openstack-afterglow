apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: afterglow
  labels:
    app: frontend
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      terminationGracePeriodSeconds: 20
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: ghcr.io/openstack-afterglow/afterglow:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3080
          env:
            - name: PORT
              value: "3080"
            - name: ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: afterglow-config
                  key: APP_ORIGIN
            - name: PUBLIC_API_BASE
              valueFrom:
                configMapKeyRef:
                  name: afterglow-config
                  key: PUBLIC_API_BASE
            - name: PUBLIC_S3_BASE
              valueFrom:
                configMapKeyRef:
                  name: afterglow-config
                  key: PUBLIC_S3_BASE
            - name: PUBLIC_GRAFANA_BASE
              valueFrom:
                configMapKeyRef:
                  name: afterglow-config
                  key: APP_GRAFANA_BASE
          startupProbe:
            httpGet:
              path: /
              port: 3080
            initialDelaySeconds: 2
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /
              port: 3080
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3080
            periodSeconds: 5
            failureThreshold: 2
            timeoutSeconds: 3
          volumeMounts:
            - name: afterglow-config-volume
              mountPath: /app/afterglow.conf
              subPath: afterglow.conf
            - name: app-logs
              mountPath: /app/logs
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "300m"
      volumes:
        - name: afterglow-config-volume
          configMap:
            name: afterglow-config
            items:
              - key: afterglow.conf
                path: afterglow.conf
        - name: app-logs
          emptyDir: {}
