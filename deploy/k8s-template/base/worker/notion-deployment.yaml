apiVersion: apps/v1
kind: Deployment
metadata:
  name: notion-worker
  namespace: afterglow
  labels:
    app: notion-worker
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: notion-worker
  template:
    metadata:
      labels:
        app: notion-worker
    spec:
      terminationGracePeriodSeconds: 30
      # No Notion/background SQL writer starts until canonical verification succeeds.
      initContainers:
        - name: schema-bootstrap
          image: ghcr.io/openstack-afterglow/afterglow-api:latest
          imagePullPolicy: Always
          command: ["python", "-m", "scripts.bootstrap_schema", "--if-configured", "--verify-only"]
          env:
            - name: AFTERGLOW_ENV
              value: "production"
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: afterglow-config
                  key: APP_REDIS_URL
          envFrom:
            - secretRef:
                name: afterglow-secrets
          volumeMounts:
            - name: afterglow-config-volume
              mountPath: /app/afterglow.conf
              subPath: afterglow.conf
              readOnly: true
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      containers:
        - name: notion-worker
          image: ghcr.io/openstack-afterglow/afterglow-worker:latest
          imagePullPolicy: Always
          command:
            - "python"
            - "-m"
            - "app.notion_worker"
          env:
            - name: AFTERGLOW_ENV
              value: "production"
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: afterglow-config
                  key: APP_REDIS_URL
            - name: OS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: afterglow-secrets
                  key: OS_PASSWORD
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: afterglow-secrets
                  key: SECRET_KEY
            - name: K3S_KUBECONFIG_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: afterglow-secrets
                  key: K3S_KUBECONFIG_ENCRYPTION_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: afterglow-secrets
                  key: DATABASE_URL
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: afterglow-secrets
                  key: SMTP_PASSWORD
                  optional: true
            - name: IMAP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: afterglow-secrets
                  key: IMAP_PASSWORD
                  optional: true
          volumeMounts:
            - name: afterglow-config-volume
              mountPath: /app/afterglow.conf
              subPath: afterglow.conf
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: afterglow-config-volume
          configMap:
            name: afterglow-config
            items:
              - key: afterglow.conf
                path: afterglow.conf
