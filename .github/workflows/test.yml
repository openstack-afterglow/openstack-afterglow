name: Layered Tests

on:
  # docker-build.yml 이 needs: 체인으로 호출 — push/PR 트리거는 거기서 관장
  workflow_call:
    inputs:
      run_live_openstack:
        description: "Run opt-in live OpenStack scenarios"
        required: false
        type: boolean
        default: false
jobs:
  version-check:
    name: Version + orchestration checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check architecture freshness
        run: python3 scripts/check_architecture.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test target orchestration
        run: npm run test:orchestration
      - name: Install uv (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Apply tag version (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_REF: ${{ github.ref }}
        run: npm run version:apply-tag
      - name: Check versions aligned
        run: bash scripts/check-version-sync.sh
        env:
          GITHUB_REF: ${{ github.ref }}

  test-backend:
    name: Backend (unit tests + lint)
    needs: version-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Apply tag version (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_REF: ${{ github.ref }}
        run: npm run version:apply-tag

      - name: Sync deps (dev)
        working-directory: backend
        run: uv sync --frozen --extra dev

      - name: Lint ruff check
        working-directory: backend
        run: uv run ruff check .

      - name: Lint ruff format check
        working-directory: backend
        run: uv run ruff format --check .

      - name: Unit tests
        env:
          AFTERGLOW_ALLOW_INSECURE: "1"
        run: npm run test:unit:backend

  test-contract:
    name: Service contract tests
    needs: version-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Apply tag version (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_REF: ${{ github.ref }}
        run: npm run version:apply-tag

      - name: Sync deps (dev)
        working-directory: backend
        run: uv sync --frozen --extra dev

      - name: Contract tests
        env:
          AFTERGLOW_ALLOW_INSECURE: "1"
        run: npm run test:contract
      - name: Kolla contract tests
        run: npm run test:kolla:contract

  # ─── 국소 기능 테스트 — 무조건 항상 실행 ──────────────────────────────────
  test-functional:
    name: Disposable local functional tests
    needs: version-check
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: dev
          MARIADB_DATABASE: afterglow_functional
          MARIADB_USER: afterglow
          MARIADB_PASSWORD: dev
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: afterglow_checkpoints
          POSTGRES_USER: afterglow
          POSTGRES_PASSWORD: dev
        ports:
          - 5434:5432
        options: >-
          --health-cmd="pg_isready -U afterglow -d afterglow_checkpoints"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Apply tag version (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_REF: ${{ github.ref }}
        run: npm run version:apply-tag

      - name: Sync deps (dev)
        working-directory: backend
        run: uv sync --frozen --extra dev

      - name: Functional tests
        env:
          AFTERGLOW_ALLOW_INSECURE: "1"
          REDIS_URL: redis://127.0.0.1:6380/0
          AFTERGLOW_REDIS_URL: redis://127.0.0.1:6380/0
          AFTERGLOW_TEST_REAL_REDIS: "1"
          AFTERGLOW_TEST_DATABASE_URL: mysql+aiomysql://afterglow:dev@127.0.0.1:3307/afterglow_functional
          AFTERGLOW_TEST_CHECKPOINTER_POSTGRES_URL: postgresql://afterglow:dev@127.0.0.1:5434/afterglow_checkpoints
        run: npm run test:functional -- --no-start

  test-frontend:
    name: Frontend (unit tests)
    needs: version-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1"

      - name: Install
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Test
        run: npm run test:unit:frontend

  # ─── secret 존재 여부 + Keystone 인증 probe를 job output으로 노출 ──────────
  detect-live:
    name: Detect live OpenStack credentials
    needs: version-check
    runs-on: ubuntu-latest
    if: ${{ inputs.run_live_openstack }}
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check OpenStack secret and verify credentials
        id: check
        env:
          OS_AUTH_URL: ${{ secrets.AFTERGLOW_OS_AUTH_URL }}
          OS_USERNAME: ${{ secrets.AFTERGLOW_OS_USERNAME }}
          OS_PASSWORD: ${{ secrets.AFTERGLOW_OS_PASSWORD }}
          OS_PROJECT_NAME: ${{ secrets.AFTERGLOW_OS_PROJECT_NAME }}
          OS_INTERFACE: ${{ vars.AFTERGLOW_OS_INTERFACE || 'public' }}
        run: |
          if [ -z "$OS_AUTH_URL" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "AFTERGLOW_OS_AUTH_URL secret is not set — skipping live OpenStack tests."
            exit 0
          fi

          # jq로 JSON body 구성 (특수문자 이스케이프 보장)
          jq -n \
            --arg u "$OS_USERNAME" \
            --arg p "$OS_PASSWORD" \
            --arg proj "$OS_PROJECT_NAME" \
            '{"auth":{"identity":{"methods":["password"],"password":{"user":{"name":$u,"password":$p,"domain":{"name":"Default"}}}},"scope":{"project":{"name":$proj,"domain":{"name":"Default"}}}}}' \
            > /tmp/ks_body.json

          # OS_AUTH_URL 정규화: trailing slash 제거 + version path 미존재 시 /v3 자동 부착
          _RAW_URL="${OS_AUTH_URL%/}"
          if echo "$_RAW_URL" | grep -qE '/v[0-9]+(\.[0-9]+)?$'; then
            _AUTH_URL="$_RAW_URL"
          else
            _AUTH_URL="$_RAW_URL/v3"
          fi

          # Keystone v3 token probe (timeout 5s) — 응답 body 저장
          if ! STATUS=$(curl -sk -o /tmp/ks_resp.json -w "%{http_code}" \
            --max-time 5 \
            -X POST "${_AUTH_URL}/auth/tokens" \
            -H "Content-Type: application/json" \
            --data "@/tmp/ks_body.json"); then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Live OpenStack tests skipped::Keystone probe transport failed or timed out. Check the OpenStack endpoint."
            exit 0
          fi

          if [ "$STATUS" != "201" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Live OpenStack tests skipped::Keystone probe returned HTTP $STATUS. Update AFTERGLOW_OS_* secrets or check the OpenStack endpoint."
            exit 0
          fi

          echo "Keystone probe succeeded (HTTP $STATUS)."

          # 카탈로그에서 network 엔드포인트 URL 추출 (interface 일치)
          NET_URL=$(jq -r --arg intf "$OS_INTERFACE" \
            '.token.catalog[] | select(.type=="network") | .endpoints[] | select(.interface==$intf) | .url' \
            /tmp/ks_resp.json | head -n1)

          if [ -z "$NET_URL" ] || [ "$NET_URL" = "null" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Live OpenStack tests skipped::network endpoint (interface=$OS_INTERFACE) not found in Keystone catalog."
            exit 0
          fi

          echo "Found network endpoint: $NET_URL"

          # 도달성 검사 — HTTP 응답 코드 무관, curl exit code만 검사
          if curl -sk --max-time 5 -o /dev/null "$NET_URL"; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Keystone + network endpoint reachable — live OpenStack tests will run."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Live OpenStack tests skipped::network endpoint $NET_URL unreachable from runner (interface=$OS_INTERFACE)."
          fi

  # ─── 실제 OpenStack 테스트: detect-live.outputs.enabled == 'true' 시만 실행 ───
  test-live:
    name: Backend (live OpenStack tests)
    needs: [test-backend, test-contract, test-functional, test-frontend, detect-live]
    runs-on: ubuntu-latest
    if: ${{ needs.detect-live.outputs.enabled == 'true' }}
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Apply tag version (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_REF: ${{ github.ref }}
        run: npm run version:apply-tag

      - name: Sync deps (dev)
        working-directory: backend
        run: uv sync --frozen --extra dev

      - name: Live OpenStack tests
        env:
          AFTERGLOW_ALLOW_INSECURE: "1"
          AFTERGLOW_REDIS_URL: redis://localhost:6379/0
          OS_AUTH_URL: ${{ secrets.AFTERGLOW_OS_AUTH_URL }}
          OS_USERNAME: ${{ secrets.AFTERGLOW_OS_USERNAME }}
          OS_PASSWORD: ${{ secrets.AFTERGLOW_OS_PASSWORD }}
          OS_PROJECT_NAME: ${{ secrets.AFTERGLOW_OS_PROJECT_NAME }}
          OS_PROJECT_DOMAIN_NAME: ${{ vars.AFTERGLOW_OS_PROJECT_DOMAIN_NAME || 'Default' }}
          OS_USER_DOMAIN_NAME: ${{ vars.AFTERGLOW_OS_USER_DOMAIN_NAME || 'Default' }}
          OS_REGION_NAME: ${{ vars.AFTERGLOW_OS_REGION_NAME || 'RegionOne' }}
          OS_INTERFACE: ${{ vars.AFTERGLOW_OS_INTERFACE || 'public' }}
          AFTERGLOW_TEST_ADMIN_USERNAME: ${{ secrets.AFTERGLOW_OS_USERNAME }}
          AFTERGLOW_TEST_ADMIN_PASSWORD: ${{ secrets.AFTERGLOW_OS_PASSWORD }}
          AFTERGLOW_TEST_ADMIN_PROJECT: ${{ secrets.AFTERGLOW_OS_PROJECT_NAME }}
          AFTERGLOW_TEST_ADMIN_USER_USERNAME: ${{ secrets.AFTERGLOW_TEST_ADMIN_USER_USERNAME }}
          AFTERGLOW_TEST_ADMIN_USER_PASSWORD: ${{ secrets.AFTERGLOW_TEST_ADMIN_USER_PASSWORD }}
          AFTERGLOW_TEST_ADMIN_USER_PROJECT: ${{ secrets.AFTERGLOW_TEST_ADMIN_USER_PROJECT }}
          AFTERGLOW_TEST_USER_USERNAME: ${{ secrets.AFTERGLOW_TEST_USER_USERNAME }}
          AFTERGLOW_TEST_USER_PASSWORD: ${{ secrets.AFTERGLOW_TEST_USER_PASSWORD }}
          AFTERGLOW_TEST_USER_PROJECT: ${{ secrets.AFTERGLOW_TEST_USER_PROJECT }}
          AFTERGLOW_TEST_PROJECT_B_USERNAME: ${{ secrets.AFTERGLOW_TEST_PROJECT_B_USERNAME }}
          AFTERGLOW_TEST_PROJECT_B_PASSWORD: ${{ secrets.AFTERGLOW_TEST_PROJECT_B_PASSWORD }}
          AFTERGLOW_TEST_PROJECT_B_NAME: ${{ secrets.AFTERGLOW_TEST_PROJECT_B_NAME }}
          AFTERGLOW_TEST_IMAGE_ID: ${{ secrets.AFTERGLOW_TEST_IMAGE_ID }}
          AFTERGLOW_TEST_FLAVOR_SMALL: ${{ secrets.AFTERGLOW_TEST_FLAVOR_SMALL }}
          AFTERGLOW_TEST_FLAVOR_MEDIUM: ${{ secrets.AFTERGLOW_TEST_FLAVOR_MEDIUM }}
          AFTERGLOW_TEST_LIBRARY_IDS: ${{ vars.AFTERGLOW_TEST_LIBRARY_IDS }}
          AFTERGLOW_TEST_SSH_KEY: ${{ secrets.AFTERGLOW_TEST_SSH_KEY }}
          AFTERGLOW_TEST_SSH_USER: ${{ vars.AFTERGLOW_TEST_SSH_USER }}
        run: npm run test:live
