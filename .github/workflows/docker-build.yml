name: Docker Build & Push

on:
  push:
    branches: [main, dev]
    tags: ['v*']
    paths-ignore:
      # test.yml + docker-build.yml(main) paths-ignore 합집합
      - 'deploy/k8s/overlays/**/.argocd-source-*.yaml'
      - 'deploy/k8s-template/overlays/**/.argocd-source-*.yaml'
      - 'deploy/k8s-template/overlays/dev/kustomization.yaml'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      targets:
        description: 'Build image set'
        required: false
        default: 'all'
        type: choice
        options: [all, afterglow, backend, frontend, worker, cloud-shell]
      run_live_openstack:
        description: 'Run manual live OpenStack scenarios'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ${{ secrets.REGISTRY_URL || 'ghcr.io' }}
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  # ─── 테스트: 레이어드 테스트 통과 후에만 빌드로 진행 ───
  test:
    name: Layered Tests
    uses: ./.github/workflows/test.yml
    with:
      run_live_openstack: ${{ github.event_name == 'workflow_dispatch' && inputs.run_live_openstack }}
    secrets: inherit

  # ─── 변경 감지: dev 브랜치에서만 선택적 빌드, 나머지는 항상 전체 빌드 ───
  changes:
    name: Detect changed targets
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      targets: ${{ steps.set-targets.outputs.targets }}
      standard_targets: ${{ steps.standard-targets.outputs.targets }}
      effective_ref: ${{ steps.eff-ref.outputs.ref }}
      cloud_shell: ${{ steps.filter.outputs.cloud_shell }}
      is_pr: ${{ steps.eff-ref.outputs.is_pr }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      # push/PR/workflow_dispatch 이벤트는 github.ref 가 정확한 ref 를 직접 가리킨다.
      - name: Resolve effective ref
        id: eff-ref
        run: |
          echo "ref=$GITHUB_REF" >> $GITHUB_OUTPUT
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            echo "is_pr=true" >> $GITHUB_OUTPUT
          else
            echo "is_pr=false" >> $GITHUB_OUTPUT
          fi

      - name: Detect file changes
        id: filter
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            exit 0
          fi

          CHANGED=$(git diff --name-only HEAD^1 HEAD 2>/dev/null || echo "ALL")

          # 비교 불가(초기 커밋 등)와 빌드 파이프라인 변경은 Afterglow 이미지를 모두 빌드한다.
          if [[ "$CHANGED" == "ALL" ]] || echo "$CHANGED" | grep -qE '^\.github/workflows/docker-build\.yml$'; then
            echo "afterglow=true" >> $GITHUB_OUTPUT
            echo "frontend=true" >> $GITHUB_OUTPUT
            echo "cloud_shell=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          if echo "$CHANGED" | grep -qE '^(backend/|Dockerfile$|\.dockerignore$|services/afterglow-crypto/)'; then
            echo "afterglow=true" >> $GITHUB_OUTPUT
          else
            echo "afterglow=false" >> $GITHUB_OUTPUT
          fi

          if echo "$CHANGED" | grep -qE '^(frontend/|Dockerfile$|\.dockerignore$)'; then
            echo "frontend=true" >> $GITHUB_OUTPUT
          else
            echo "frontend=false" >> $GITHUB_OUTPUT
          fi

          if echo "$CHANGED" | grep -qE '^(cloud-shell/|Dockerfile$|\.dockerignore$)'; then
            echo "cloud_shell=true" >> $GITHUB_OUTPUT
          else
            echo "cloud_shell=false" >> $GITHUB_OUTPUT
          fi

      - name: Build target list
        id: set-targets
        env:
          CHANGED_AFTERGLOW: ${{ steps.filter.outputs.afterglow }}
          CHANGED_FRONTEND: ${{ steps.filter.outputs.frontend }}
          CHANGED_CLOUD_SHELL: ${{ steps.filter.outputs.cloud_shell }}
          DISPATCH_TARGETS: ${{ inputs.targets }}
          EFFECTIVE_REF: ${{ steps.eff-ref.outputs.ref }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            case "${DISPATCH_TARGETS}" in
              backend) echo 'targets=["backend"]' >> $GITHUB_OUTPUT ;;
              frontend) echo 'targets=["frontend"]' >> $GITHUB_OUTPUT ;;
              worker) echo 'targets=["worker"]' >> $GITHUB_OUTPUT ;;
              cloud-shell) echo 'targets=["cloud-shell"]' >> $GITHUB_OUTPUT ;;
              afterglow|all) echo 'targets=["backend","frontend","worker","cloud-shell"]' >> $GITHUB_OUTPUT ;;
              *) echo "Unsupported dispatch target: ${DISPATCH_TARGETS}" >&2; exit 1 ;;
            esac
            exit 0
          fi

          # dev 브랜치 이외(main, v* 태그, PR)는 Afterglow 전체 빌드
          if [[ "${EFFECTIVE_REF}" != "refs/heads/dev" ]]; then
            echo 'targets=["backend","frontend","worker","cloud-shell"]' >> $GITHUB_OUTPUT
            exit 0
          fi

          TARGETS="[]"
          if [[ "${CHANGED_AFTERGLOW}" == "true" ]]; then
            TARGETS=$(echo "$TARGETS" | jq -c '. + ["backend", "worker"]')
          fi
          # Backend/worker와 frontend는 같은 dev 배포 세트로 갱신한다.
          if [[ "${CHANGED_FRONTEND}" == "true" || "${CHANGED_AFTERGLOW}" == "true" ]]; then
            TARGETS=$(echo "$TARGETS" | jq -c '. + ["frontend"]')
          fi
          if [[ "${CHANGED_CLOUD_SHELL}" == "true" ]]; then
            TARGETS=$(echo "$TARGETS" | jq -c '. + ["cloud-shell"]')
          fi
          echo "targets=${TARGETS}" >> $GITHUB_OUTPUT

      - name: Build standard target list
        id: standard-targets
        env:
          TARGETS: ${{ steps.set-targets.outputs.targets }}
        run: echo "targets=$(echo "$TARGETS" | jq -c 'map(select(. != "cloud-shell"))')" >> $GITHUB_OUTPUT

  # ─── per-arch 빌드: self-hosted linux(amd64) / macos(arm64) native 빌드 ───
  build:
    name: Build ${{ matrix.target }} (${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.is_pr != 'true' && needs.changes.outputs.standard_targets != '[]'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.changes.outputs.standard_targets) }}
        # arm64 빌드 비활성화 — arm64 self-hosted(macOS) 러너가 상시 가동되지 않아
        # 빌드 잡이 queued 로 정체되고 manifest 병합까지 막혀 :dev 태그가 갱신되지 않았다.
        # arm64 가 다시 필요하면 아래 원본 2줄(arch 배열 + include 항목)의 주석을 되살린다.
        # arch: [amd64, arm64]
        arch: [amd64]
        include:
          - arch: amd64
            runner: [self-hosted, linux, x64]
            platform: linux/amd64
          # - arch: arm64
          #   runner: [self-hosted, linux, arm64]
          #   platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Install uv (tag push only)
        if: startsWith(needs.changes.outputs.effective_ref, 'refs/tags/v')
        uses: astral-sh/setup-uv@v6
        with:
          # arm64 self-hosted macos runner 는 backend/frontend 잡이 동일
          # ~/.cache/uv 를 공유 → 두 잡의 post-job `uv cache prune --ci` 가 동시
          # 실행되며 lock 충돌 (300s timeout). amd64 (linux runner 별도 인스턴스)
          # 만 캐시 활성화. tag push 1회성이라 캐시 미사용 영향은 작음.
          enable-cache: ${{ matrix.arch == 'amd64' }}

      - name: Setup Node (tag push only)
        if: startsWith(needs.changes.outputs.effective_ref, 'refs/tags/v')
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Apply tag version (tag push only)
        if: startsWith(needs.changes.outputs.effective_ref, 'refs/tags/v')
        env:
          GITHUB_REF: ${{ needs.changes.outputs.effective_ref }}
        run: npm run version:apply-tag

      - name: Verify version sync
        run: bash scripts/check-version-sync.sh
        env:
          GITHUB_REF: ${{ needs.changes.outputs.effective_ref }}

      - name: Resolve image name
        id: img
        run: |
          case "${{ matrix.target }}" in
            backend) image_name="afterglow-api" ;;
            frontend) image_name="afterglow" ;;
            worker) image_name="afterglow-worker" ;;
            *) echo "Unsupported build target: ${{ matrix.target }}" >&2; exit 1 ;;
          esac
          echo "name=${REGISTRY}/${IMAGE_OWNER}/${image_name}" >> $GITHUB_OUTPUT

      # macOS arm64: Docker Desktop이 꺼져 있으면 소켓이 없어 빌드 불가.
      # Docker Desktop 실행 후 daemon 준비 대기 (최대 90초).
      - name: Ensure Docker daemon is running (macOS)
        if: matrix.arch == 'arm64'
        run: |
          if docker info &>/dev/null; then
            echo "Docker daemon already running."
            exit 0
          fi
          echo "Docker daemon not running — starting Docker Desktop..."
          open -a Docker 2>/dev/null || true
          for i in $(seq 1 45); do
            if docker info &>/dev/null; then
              echo "Docker daemon ready after $((i * 2))s."
              exit 0
            fi
            sleep 2
          done
          echo "::warning::Docker daemon did not start in 90s — build may fail."

      # macOS arm64: Keychain 완전 우회
      # docker login-action이 osxkeychain 저장을 시도하므로,
      # 레지스트리 자격증명을 base64로 직접 config.json에 기록하고 DOCKER_CONFIG 설정
      - name: Pre-auth registry into config.json (macOS — no keychain)
        if: matrix.arch == 'arm64'
        env:
          REG_USER: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          REG_PASS: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}
        run: |
          DOCKER_CONF_DIR="${RUNNER_TEMP}/docker-config"
          mkdir -p "${DOCKER_CONF_DIR}"
          AUTH=$(printf "%s:%s" "${REG_USER}" "${REG_PASS}" | base64 | tr -d '\r\n')
          printf '{"auths":{"%s":{"auth":"%s"}}}\n' "${REGISTRY}" "${AUTH}" \
            > "${DOCKER_CONF_DIR}/config.json"
          echo "DOCKER_CONFIG=${DOCKER_CONF_DIR}" >> "$GITHUB_ENV"

      # macOS arm64 러너: docker-container 드라이버는 buildkit 컨테이너 부팅 시
      # macOS Keychain을 호출하므로 keychain-free 'docker' 드라이버 사용
      - name: Set up Docker Buildx (macOS — docker driver)
        if: matrix.arch == 'arm64'
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      - name: Set up Docker Buildx (Linux — docker-container driver)
        if: matrix.arch == 'amd64'
        uses: docker/setup-buildx-action@v4

      # amd64 Linux만 docker login 실행 (arm64는 위 pre-auth로 대체)
      - name: Log in to registry
        if: matrix.arch == 'amd64'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Compute base tag
        id: tag
        env:
          EFFECTIVE_REF: ${{ needs.changes.outputs.effective_ref }}
        run: |
          if [[ "${EFFECTIVE_REF}" == refs/tags/v* ]]; then
            echo "base=${EFFECTIVE_REF#refs/tags/}" >> $GITHUB_OUTPUT
          elif [[ "${EFFECTIVE_REF}" == refs/heads/main ]]; then
            echo "base=nightly" >> $GITHUB_OUTPUT
          else
            echo "base=dev" >> $GITHUB_OUTPUT
          fi

      # arm64 (macOS, docker driver): registry cache 미지원 → 캐시 없이 빌드
      - name: Build & push arm64 (docker driver)
        if: matrix.arch == 'arm64'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          push: ${{ needs.changes.outputs.is_pr != 'true' }}
          tags: ${{ steps.img.outputs.name }}:${{ steps.tag.outputs.base }}-${{ matrix.arch }}

      # amd64 (Linux, docker-container driver): registry cache 사용
      - name: Build & push amd64 (docker-container driver)
        if: matrix.arch == 'amd64'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          push: ${{ needs.changes.outputs.is_pr != 'true' }}
          tags: ${{ steps.img.outputs.name }}:${{ steps.tag.outputs.base }}-${{ matrix.arch }}
          cache-from: type=registry,ref=${{ steps.img.outputs.name }}:cache-${{ matrix.arch }}
          cache-to: ${{ needs.changes.outputs.is_pr != 'true' && format('type=registry,ref={0}:cache-{1},mode=max', steps.img.outputs.name, matrix.arch) || '' }}

  # Cloud Shell is published for both supported architectures from a hosted
  # Linux runner. QEMU avoids depending on the intentionally disabled macOS
  # arm64 runner used by the legacy image matrix.
  build-cloud-shell:
    name: Build Cloud Shell (amd64 + arm64)
    needs: changes
    if: needs.changes.outputs.is_pr != 'true' && contains(fromJSON(needs.changes.outputs.targets), 'cloud-shell')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Install uv (tag push only)
        if: startsWith(needs.changes.outputs.effective_ref, 'refs/tags/v')
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Setup Node (tag push only)
        if: startsWith(needs.changes.outputs.effective_ref, 'refs/tags/v')
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Apply tag version (tag push only)
        if: startsWith(needs.changes.outputs.effective_ref, 'refs/tags/v')
        env:
          GITHUB_REF: ${{ needs.changes.outputs.effective_ref }}
        run: npm run version:apply-tag

      - name: Verify version sync
        run: bash scripts/check-version-sync.sh
        env:
          GITHUB_REF: ${{ needs.changes.outputs.effective_ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Resolve tags
        id: tags
        env:
          EFFECTIVE_REF: ${{ needs.changes.outputs.effective_ref }}
        run: |
          IMAGE="${REGISTRY}/${IMAGE_OWNER}/afterglow-cloud-shell"
          echo 'values<<EOF' >> $GITHUB_OUTPUT
          if [[ "${EFFECTIVE_REF}" == refs/tags/v* ]]; then
            echo "${IMAGE}:${EFFECTIVE_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "${IMAGE}:latest" >> $GITHUB_OUTPUT
          elif [[ "${EFFECTIVE_REF}" == refs/heads/main ]]; then
            echo "${IMAGE}:nightly" >> $GITHUB_OUTPUT
          else
            echo "${IMAGE}:dev" >> $GITHUB_OUTPUT
          fi
          echo 'EOF' >> $GITHUB_OUTPUT

      - name: Build and push Cloud Shell
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: cloud-shell
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.values }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/afterglow-cloud-shell:cache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/afterglow-cloud-shell:cache,mode=max

  # ─── manifest 통합: 두 arch 태그를 합쳐 단일 멀티플랫폼 태그로 push ───
  manifest:
    name: Manifest ${{ matrix.target }}
    needs: [changes, build]
    if: needs.changes.outputs.is_pr != 'true' && needs.changes.outputs.standard_targets != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: ${{ fromJSON(needs.changes.outputs.standard_targets) }}

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Resolve image name
        id: img
        run: |
          case "${{ matrix.target }}" in
            backend) image_name="afterglow-api" ;;
            frontend) image_name="afterglow" ;;
            worker) image_name="afterglow-worker" ;;
            *) echo "Unsupported manifest target: ${{ matrix.target }}" >&2; exit 1 ;;
          esac
          echo "name=${REGISTRY}/${IMAGE_OWNER}/${image_name}" >> $GITHUB_OUTPUT

      - name: Compute final tags
        id: tags
        env:
          EFFECTIVE_REF: ${{ needs.changes.outputs.effective_ref }}
        run: |
          if [[ "${EFFECTIVE_REF}" == refs/tags/v* ]]; then
            VTAG="${EFFECTIVE_REF#refs/tags/}"
            echo "primary=${{ steps.img.outputs.name }}:${VTAG}" >> $GITHUB_OUTPUT
            echo "extra=${{ steps.img.outputs.name }}:latest" >> $GITHUB_OUTPUT
            echo "base=${VTAG}" >> $GITHUB_OUTPUT
          elif [[ "${EFFECTIVE_REF}" == refs/heads/main ]]; then
            echo "primary=${{ steps.img.outputs.name }}:nightly" >> $GITHUB_OUTPUT
            echo "extra=" >> $GITHUB_OUTPUT
            echo "base=nightly" >> $GITHUB_OUTPUT
          else
            echo "primary=${{ steps.img.outputs.name }}:dev" >> $GITHUB_OUTPUT
            echo "extra=" >> $GITHUB_OUTPUT
            echo "base=dev" >> $GITHUB_OUTPUT
          fi

      # arm64 빌드 비활성화 상태 — amd64 단일 소스로 최종 태그를 만든다.
      # arm64 를 되살리면 이 amd64 전용 블록을 주석 처리하고 아래 "원본(2-arch)" 블록을 되살린다.
      - name: Create multi-arch manifest
        run: |
          BASE="${{ steps.tags.outputs.base }}"
          IMG="${{ steps.img.outputs.name }}"
          docker buildx imagetools create \
            -t "${{ steps.tags.outputs.primary }}" \
            "${IMG}:${BASE}-amd64"
          if [ -n "${{ steps.tags.outputs.extra }}" ]; then
            docker buildx imagetools create \
              -t "${{ steps.tags.outputs.extra }}" \
              "${IMG}:${BASE}-amd64"
          fi
          # ── 원본 (amd64 + arm64 멀티아치) — arm64 러너 복구 시 되살릴 것 ──
          # docker buildx imagetools create \
          #   -t "${{ steps.tags.outputs.primary }}" \
          #   "${IMG}:${BASE}-amd64" \
          #   "${IMG}:${BASE}-arm64"
          # if [ -n "${{ steps.tags.outputs.extra }}" ]; then
          #   docker buildx imagetools create \
          #     -t "${{ steps.tags.outputs.extra }}" \
          #     "${IMG}:${BASE}-amd64" \
          #     "${IMG}:${BASE}-arm64"
          # fi
