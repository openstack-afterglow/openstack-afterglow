name: Docker Build & Push

on:
  push:
    branches: [main, dev]
    tags: ['v*']
    paths-ignore:
      # test.yml + docker-build.yml(main) paths-ignore 합집합
      - 'deploy/k8s/overlays/**/.argocd-source-*.yaml'
      - 'deploy/k8s-template/overlays/**/.argocd-source-*.yaml'
      - 'deploy/k8s-template/overlays/dev/kustomization.yaml'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      targets:
        description: 'Build image set'
        required: false
        default: 'all'
        type: choice
        options: [all, afterglow, backend, frontend, worker, cloud-shell]
      run_live_openstack:
        description: 'Run manual live OpenStack scenarios'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ${{ secrets.REGISTRY_URL || 'ghcr.io' }}
  IMAGE_OWNER: ${{ github.repository_owner }}

# 동시성 그룹의 cancel-in-progress 를 push 실행에 두지 않는다. 각 dev push 는 자기 이미지를 발행해야
# 하며, 취소된 push 실행은 대상 이미지를 빌드하지 않은 채 남긴다. 실행 순서 문제는 manifest 의
# stale re-run 가드(발행 revision 비교)가 담당한다.
jobs:
  # ─── PR 중복 테스트 제거: 입력(tree)이 dev push 실행과 같을 때만 건너뛴다 ───
  # 같은 저장소의 `dev` 브랜치에서 온 PR 이고 PR merge commit tree 가 head commit tree 와 같으면,
  # 동일한 tree 를 dev push 실행이 이미 테스트한다. fork PR·dependabot PR·diverged PR 은 항상 테스트한다.
  # 브랜치 이름만으로 판단하지 않는다(fork 의 동명 `dev` 브랜치는 head repo 비교로 걸러진다).
  # 판단 중 오류가 나면 skip=false(테스트 실행)다. push/dispatch 에서는 이 잡이 실행되지 않는다.
  pr-dedup:
    name: PR duplicate-input check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # 이 잡의 실패가 PR 테스트를 막지 않게 한다(실패 시 skip 출력이 비어 test-pr 가 실행된다).
    continue-on-error: true
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.dedup.outputs.skip }}
    steps:
      - name: Checkout PR merge commit
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Compare merge tree with head tree
        id: dedup
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          skip=false
          decide() {
            if [ "$HEAD_REPO" != "$BASE_REPO" ]; then
              echo "head repository ${HEAD_REPO} is not ${BASE_REPO}; testing"
              return 0
            fi
            if [ "$HEAD_REF" != "dev" ]; then
              echo "head ref is not dev; testing"
              return 0
            fi
            if ! printf '%s' "$HEAD_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "head SHA is malformed; testing"
              return 0
            fi
            git fetch --no-tags --depth=1 origin "$HEAD_SHA" || return 1
            merge_tree=$(git rev-parse 'HEAD^{tree}') || return 1
            head_tree=$(git rev-parse "${HEAD_SHA}^{tree}") || return 1
            if [ -n "$merge_tree" ] && [ "$merge_tree" = "$head_tree" ]; then
              skip=true
              echo "::notice title=Layered Tests deduplicated::PR merge tree ${merge_tree} equals dev head ${HEAD_SHA} tree; the dev push run tests the same input."
            else
              echo "merge tree ${merge_tree} differs from head tree ${head_tree}; testing"
            fi
          }
          if ! decide; then
            skip=false
            echo "::warning::PR dedup check failed; running Layered Tests"
          fi
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"

  # ─── 테스트: 레이어드 테스트 통과 후에만 빌드로 진행 ───
  # push/dispatch 와 PR 은 서로 다른 caller job 으로 같은 reusable workflow 를 호출한다.
  # push 경로의 caller 는 needs 가 없어 skipped 조상이 없다. skipped 조상이 있으면 암묵적 success() 가
  # reusable workflow 내부 잡까지 건너뛰게 할 수 있으므로, PR 전용 pr-dedup 은 test-pr 에만 건다.
  test:
    name: Layered Tests
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/test.yml
    with:
      run_live_openstack: ${{ github.event_name == 'workflow_dispatch' && inputs.run_live_openstack }}
    secrets: inherit

  test-pr:
    name: Layered Tests (PR)
    needs: pr-dedup
    if: ${{ !cancelled() && needs.pr-dedup.outputs.skip != 'true' }}
    uses: ./.github/workflows/test.yml
    with:
      run_live_openstack: false
    secrets: inherit

  # ─── 변경 감지: dev 브랜치에서만 선택적 빌드, 나머지는 항상 전체 빌드 ───
  # 규칙과 fail-safe 는 scripts/ci/detect-build-targets.js(단위 테스트 포함)가 소유한다.
  # - push: github.event.before..HEAD (before 를 depth=1 로 fetch). zero SHA·forced·fetch/diff 실패는 전체.
  # - dev push: 발행된 :dev 이미지의 org.opencontainers.image.revision 기준 diff 를 target 별로 더한다
  #   (실패한 이전 실행의 누락분 복구). label 조회 불가는 event 기준, 이후 오류는 그 target 빌드.
  # - PR: merge commit 의 HEAD^1..HEAD 가 PR 전체 diff 이다(참고용, PR 은 빌드하지 않는다).
  # push 에서는 test-pr, PR 에서는 test 가 skipped 이므로 암묵적 success() 대신 결과를 명시적으로 확인한다.
  changes:
    name: Detect changed targets
    needs: [test, test-pr]
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test-pr.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      packages: read
    outputs:
      targets: ${{ steps.set-targets.outputs.targets }}
      standard_targets: ${{ steps.set-targets.outputs.standard_targets }}
      effective_ref: ${{ steps.eff-ref.outputs.ref }}
      cloud_shell: ${{ steps.set-targets.outputs.cloud_shell }}
      is_pr: ${{ steps.eff-ref.outputs.is_pr }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      # push/PR/workflow_dispatch 이벤트는 github.ref 가 정확한 ref 를 직접 가리킨다.
      - name: Resolve effective ref
        id: eff-ref
        run: |
          echo "ref=$GITHUB_REF" >> $GITHUB_OUTPUT
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            echo "is_pr=true" >> $GITHUB_OUTPUT
          else
            echo "is_pr=false" >> $GITHUB_OUTPUT
          fi

      # 발행 revision 조회(읽기 전용)는 push 에서만 한다. PR 코드가 레지스트리 자격 증명을 보지 않는다.
      # 로그인 실패는 revision 조회 불가로 처리되어 event.before 기준으로 fallback 한다.
      - name: Log in to registry (push only, read published revisions)
        if: github.event_name == 'push'
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Detect build targets
        id: set-targets
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_FORCED: ${{ github.event.forced }}
          DISPATCH_TARGETS: ${{ inputs.targets }}
          EFFECTIVE_REF: ${{ steps.eff-ref.outputs.ref }}
          GH_TOKEN: ${{ github.event_name == 'push' && github.token || '' }}
        run: node scripts/ci/detect-build-targets.js

  # ─── per-arch 빌드: self-hosted linux(amd64) / macos(arm64) native 빌드 ───
  build:
    name: Build ${{ matrix.target }} (${{ matrix.arch }})
    needs: changes
    # PR 은 self-hosted 빌드 matrix 를 예약할 수 없다. !cancelled() + 결과 확인은 skipped test/test-pr 조상 대비다.
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.is_pr != 'true' && needs.changes.outputs.standard_targets != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.changes.outputs.standard_targets) }}
        # arm64 빌드 비활성화 — arm64 self-hosted(macOS) 러너가 상시 가동되지 않아
        # 빌드 잡이 queued 로 정체되고 manifest 병합까지 막혀 :dev 태그가 갱신되지 않았다.
        # arm64 가 다시 필요하면 아래 원본 2줄(arch 배열 + include 항목)의 주석을 되살린다.
        # arch: [amd64, arm64]
        arch: [amd64]
        include:
          - arch: amd64
            runner: [self-hosted, linux, x64]
            platform: linux/amd64
          # - arch: arm64
          #   runner: [self-hosted, linux, arm64]
          #   platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Install uv (tag push only)
        if: startsWith(needs.changes.outputs.effective_ref, 'refs/tags/v')
        uses: astral-sh/setup-uv@v6
        with:
          # arm64 self-hosted macos runner 는 backend/frontend 잡이 동일
          # ~/.cache/uv 를 공유 → 두 잡의 post-job `uv cache prune --ci` 가 동시
          # 실행되며 lock 충돌 (300s timeout). amd64 (linux runner 별도 인스턴스)
          # 만 캐시 활성화. tag push 1회성이라 캐시 미사용 영향은 작음.
          enable-cache: ${{ matrix.arch == 'amd64' }}

      - name: Setup Node (tag push only)
        if: startsWith(needs.changes.outputs.effective_ref, 'refs/tags/v')
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Apply tag version (tag push only)
        if: startsWith(needs.changes.outputs.effective_ref, 'refs/tags/v')
        env:
          GITHUB_REF: ${{ needs.changes.outputs.effective_ref }}
        run: npm run version:apply-tag

      - name: Verify version sync
        run: bash scripts/check-version-sync.sh
        env:
          GITHUB_REF: ${{ needs.changes.outputs.effective_ref }}

      - name: Resolve image name
        id: img
        run: |
          case "${{ matrix.target }}" in
            backend) image_name="afterglow-api" ;;
            frontend) image_name="afterglow" ;;
            worker) image_name="afterglow-worker" ;;
            *) echo "Unsupported build target: ${{ matrix.target }}" >&2; exit 1 ;;
          esac
          echo "name=${REGISTRY}/${IMAGE_OWNER}/${image_name}" >> $GITHUB_OUTPUT

      # macOS arm64: Docker Desktop이 꺼져 있으면 소켓이 없어 빌드 불가.
      # Docker Desktop 실행 후 daemon 준비 대기 (최대 90초).
      - name: Ensure Docker daemon is running (macOS)
        if: matrix.arch == 'arm64'
        run: |
          if docker info &>/dev/null; then
            echo "Docker daemon already running."
            exit 0
          fi
          echo "Docker daemon not running — starting Docker Desktop..."
          open -a Docker 2>/dev/null || true
          for i in $(seq 1 45); do
            if docker info &>/dev/null; then
              echo "Docker daemon ready after $((i * 2))s."
              exit 0
            fi
            sleep 2
          done
          echo "::warning::Docker daemon did not start in 90s — build may fail."

      # macOS arm64: Keychain 완전 우회
      # docker login-action이 osxkeychain 저장을 시도하므로,
      # 레지스트리 자격증명을 base64로 직접 config.json에 기록하고 DOCKER_CONFIG 설정
      - name: Pre-auth registry into config.json (macOS — no keychain)
        if: matrix.arch == 'arm64'
        env:
          REG_USER: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          REG_PASS: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}
        run: |
          DOCKER_CONF_DIR="${RUNNER_TEMP}/docker-config"
          mkdir -p "${DOCKER_CONF_DIR}"
          AUTH=$(printf "%s:%s" "${REG_USER}" "${REG_PASS}" | base64 | tr -d '\r\n')
          printf '{"auths":{"%s":{"auth":"%s"}}}\n' "${REGISTRY}" "${AUTH}" \
            > "${DOCKER_CONF_DIR}/config.json"
          echo "DOCKER_CONFIG=${DOCKER_CONF_DIR}" >> "$GITHUB_ENV"

      # macOS arm64 러너: docker-container 드라이버는 buildkit 컨테이너 부팅 시
      # macOS Keychain을 호출하므로 keychain-free 'docker' 드라이버 사용
      - name: Set up Docker Buildx (macOS — docker driver)
        if: matrix.arch == 'arm64'
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      - name: Set up Docker Buildx (Linux — docker-container driver)
        if: matrix.arch == 'amd64'
        uses: docker/setup-buildx-action@v4

      # amd64 Linux만 docker login 실행 (arm64는 위 pre-auth로 대체)
      - name: Log in to registry
        if: matrix.arch == 'amd64'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Compute base tag
        id: tag
        env:
          EFFECTIVE_REF: ${{ needs.changes.outputs.effective_ref }}
        run: |
          if [[ "${EFFECTIVE_REF}" == refs/tags/v* ]]; then
            echo "base=${EFFECTIVE_REF#refs/tags/}" >> $GITHUB_OUTPUT
          elif [[ "${EFFECTIVE_REF}" == refs/heads/main ]]; then
            echo "base=nightly" >> $GITHUB_OUTPUT
          else
            echo "base=dev" >> $GITHUB_OUTPUT
          fi

      # arm64 (macOS, docker driver): registry cache 미지원 → 캐시 없이 빌드
      - name: Build & push arm64 (docker driver)
        if: matrix.arch == 'arm64'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          push: ${{ needs.changes.outputs.is_pr != 'true' }}
          tags: ${{ steps.img.outputs.name }}:${{ steps.tag.outputs.base }}-${{ matrix.arch }}
          labels: org.opencontainers.image.revision=${{ github.sha }}

      # amd64 (Linux, docker-container driver): registry cache 사용
      - name: Build & push amd64 (docker-container driver)
        if: matrix.arch == 'amd64'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          push: ${{ needs.changes.outputs.is_pr != 'true' }}
          tags: ${{ steps.img.outputs.name }}:${{ steps.tag.outputs.base }}-${{ matrix.arch }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=registry,ref=${{ steps.img.outputs.name }}:cache-${{ matrix.arch }}
          cache-to: ${{ needs.changes.outputs.is_pr != 'true' && format('type=registry,ref={0}:cache-{1},mode=max', steps.img.outputs.name, matrix.arch) || '' }}

  # Cloud Shell is published for both supported architectures from a hosted
  # Linux runner. QEMU avoids depending on the intentionally disabled macOS
  # arm64 runner used by the legacy image matrix.
  build-cloud-shell:
    name: Build Cloud Shell (amd64 + arm64)
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.is_pr != 'true' && contains(fromJSON(needs.changes.outputs.targets), 'cloud-shell') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Install uv (tag push only)
        if: startsWith(needs.changes.outputs.effective_ref, 'refs/tags/v')
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Setup Node (tag push only)
        if: startsWith(needs.changes.outputs.effective_ref, 'refs/tags/v')
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Apply tag version (tag push only)
        if: startsWith(needs.changes.outputs.effective_ref, 'refs/tags/v')
        env:
          GITHUB_REF: ${{ needs.changes.outputs.effective_ref }}
        run: npm run version:apply-tag

      - name: Verify version sync
        run: bash scripts/check-version-sync.sh
        env:
          GITHUB_REF: ${{ needs.changes.outputs.effective_ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Resolve tags
        id: tags
        env:
          EFFECTIVE_REF: ${{ needs.changes.outputs.effective_ref }}
        run: |
          IMAGE="${REGISTRY}/${IMAGE_OWNER}/afterglow-cloud-shell"
          echo 'values<<EOF' >> $GITHUB_OUTPUT
          if [[ "${EFFECTIVE_REF}" == refs/tags/v* ]]; then
            echo "${IMAGE}:${EFFECTIVE_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "${IMAGE}:latest" >> $GITHUB_OUTPUT
          elif [[ "${EFFECTIVE_REF}" == refs/heads/main ]]; then
            echo "${IMAGE}:nightly" >> $GITHUB_OUTPUT
          else
            echo "${IMAGE}:dev" >> $GITHUB_OUTPUT
          fi
          echo 'EOF' >> $GITHUB_OUTPUT

      # Stale re-run 가드: 브랜치 태그(:dev/:nightly)의 현재 발행 revision 이 이번 SHA 보다 새로우면
      # (compare=behind) 빌드·push 를 건너뛴다. revision 을 모르면 진행한다. 버전 태그는 항상 발행한다.
      # 가드는 빌드 전에 평가되므로, 동시에 실행 중인 더 새로운 실행이 이 빌드 도중 발행하는 경합은 남는다.
      - name: Stale re-run guard
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          EFFECTIVE_REF: ${{ needs.changes.outputs.effective_ref }}
        run: |
          publish=true
          if [[ "${EFFECTIVE_REF}" != refs/tags/v* ]]; then
            BRANCH_TAG="${REGISTRY}/${IMAGE_OWNER}/afterglow-cloud-shell:dev"
            if [[ "${EFFECTIVE_REF}" == refs/heads/main ]]; then
              BRANCH_TAG="${REGISTRY}/${IMAGE_OWNER}/afterglow-cloud-shell:nightly"
            fi
            set +e
            node scripts/ci/image-revision.js guard "${BRANCH_TAG}" "${GITHUB_SHA}" "${GITHUB_REPOSITORY}"
            rc=$?
            set -e
            case "$rc" in
              0) ;;
              3) publish=false ;;
              *) echo "::error::stale re-run guard failed with exit ${rc}"; exit "$rc" ;;
            esac
          fi
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"

      - name: Build and push Cloud Shell
        if: steps.guard.outputs.publish == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: cloud-shell
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.values }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/afterglow-cloud-shell:cache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/afterglow-cloud-shell:cache,mode=max

  # ─── manifest 통합: 두 arch 태그를 합쳐 단일 멀티플랫폼 태그로 push ───
  # target 별로 독립 실행한다. 다른 target 의 빌드가 실패해도 이 target 의 per-arch 이미지가
  # 이번 SHA(revision label)로 발행됐으면 manifest 를 만든다. fail-fast 를 끄지 않으면 한 leg 실패가
  # 나머지 leg 를 취소한다.
  manifest:
    name: Manifest ${{ matrix.target }}
    needs: [changes, build]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.is_pr != 'true' && needs.changes.outputs.standard_targets != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.changes.outputs.standard_targets) }}

    steps:
      - name: Checkout CI scripts
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          sparse-checkout: scripts/ci
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Resolve image name
        id: img
        run: |
          case "${{ matrix.target }}" in
            backend) image_name="afterglow-api" ;;
            frontend) image_name="afterglow" ;;
            worker) image_name="afterglow-worker" ;;
            *) echo "Unsupported manifest target: ${{ matrix.target }}" >&2; exit 1 ;;
          esac
          echo "name=${REGISTRY}/${IMAGE_OWNER}/${image_name}" >> $GITHUB_OUTPUT

      - name: Compute final tags
        id: tags
        env:
          EFFECTIVE_REF: ${{ needs.changes.outputs.effective_ref }}
          IMG: ${{ steps.img.outputs.name }}
        run: |
          if [[ "${EFFECTIVE_REF}" == refs/tags/v* ]]; then
            VTAG="${EFFECTIVE_REF#refs/tags/}"
            primary="${IMG}:${VTAG}"; extra="${IMG}:latest"; base="${VTAG}"; branch_tag=false
          elif [[ "${EFFECTIVE_REF}" == refs/heads/main ]]; then
            primary="${IMG}:nightly"; extra=""; base="nightly"; branch_tag=true
          else
            primary="${IMG}:dev"; extra=""; base="dev"; branch_tag=true
          fi
          {
            echo "primary=${primary}"
            echo "extra=${extra}"
            echo "base=${base}"
            echo "branch_tag=${branch_tag}"
          } >> "$GITHUB_OUTPUT"

      # 이 target 의 per-arch 이미지가 이번 SHA 로 발행됐는지 확인한다. per-arch 태그는 SHA 가 아니라
      # `<base>-<arch>` 이므로 digest 를 먼저 얻고 그 digest 의 revision label 이 github.sha 인지 본다.
      # 빌드가 실패했거나 다른 실행이 태그를 덮어썼으면 이 leg 를 실패시킨다. 검증한 digest 로만 manifest 를 만든다.
      - name: Verify per-arch images for this revision
        id: verify
        env:
          IMG: ${{ steps.img.outputs.name }}
          BASE: ${{ steps.tags.outputs.base }}
        run: |
          # arm64 빌드 비활성화 상태 — 복구 시 ARCHES="amd64 arm64"
          ARCHES="amd64"
          for arch in ${ARCHES}; do
            digest=$(node scripts/ci/image-revision.js verify "${IMG}:${BASE}-${arch}" "${GITHUB_SHA}")
            echo "${arch}=${digest}" >> "$GITHUB_OUTPUT"
          done

      # arm64 빌드 비활성화 상태 — amd64 단일 소스로 최종 태그를 만든다.
      # arm64 를 되살리면 SOURCES 에 "${IMG}@${{ steps.verify.outputs.arm64 }}" 를 추가한다.
      # Stale re-run 가드: 브랜치 태그(:dev/:nightly)의 현재 발행 revision 이 이번 SHA 보다 새로우면
      # (compare=behind) retag 를 건너뛴다. 발행 revision 을 모르면 진행한다. 버전 태그/latest 는 가드하지 않는다.
      - name: Create multi-arch manifest
        env:
          GH_TOKEN: ${{ github.token }}
          IMG: ${{ steps.img.outputs.name }}
          PRIMARY: ${{ steps.tags.outputs.primary }}
          EXTRA: ${{ steps.tags.outputs.extra }}
          BRANCH_TAG: ${{ steps.tags.outputs.branch_tag }}
          AMD64_DIGEST: ${{ steps.verify.outputs.amd64 }}
        run: |
          SOURCES=("${IMG}@${AMD64_DIGEST}")
          if [[ "${BRANCH_TAG}" == "true" ]]; then
            set +e
            node scripts/ci/image-revision.js guard "${PRIMARY}" "${GITHUB_SHA}" "${GITHUB_REPOSITORY}"
            rc=$?
            set -e
            case "$rc" in
              0) ;;
              3) exit 0 ;;
              *) echo "::error::stale re-run guard failed with exit ${rc}"; exit "$rc" ;;
            esac
          fi
          docker buildx imagetools create -t "${PRIMARY}" "${SOURCES[@]}"
          if [ -n "${EXTRA}" ]; then
            docker buildx imagetools create -t "${EXTRA}" "${SOURCES[@]}"
          fi
