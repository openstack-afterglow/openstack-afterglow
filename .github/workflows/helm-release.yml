name: Helm Chart Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '배포할 차트 버전 (Chart.yaml 기본값 사용 시 비워두기)'
        required: false

jobs:
  # ─── chart 발행 판단: push 의 모든 커밋(github.event.before..github.sha)을 본다 ───
  # 규칙과 fail-safe 는 scripts/ci/helm-publish-decision.js(단위 테스트 포함)가 소유한다(CI 규정 8번).
  # - 태그·workflow_dispatch 는 항상 발행한다.
  # - main push 는 before 를 depth=1 로 fetch 해 before..sha 에 helm/afterglow/ 변경이 있을 때 발행한다.
  #   zero SHA·forced push·fetch/diff 실패는 발행한다. 첫 부모와 HEAD 처럼 마지막 커밋만 비교하면 fast-forward 로
  #   여러 커밋이 들어온 push 에서 앞 커밋의 chart 변경을 놓친다.
  check-changes:
    name: Check helm changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_publish: ${{ steps.decide.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Decide whether to publish
        id: decide
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_FORCED: ${{ github.event.forced }}
        run: node scripts/ci/helm-publish-decision.js

  helm-publish:
    name: Package & Push Helm Chart
    needs: check-changes
    if: needs.check-changes.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.17.0'

      - name: Determine chart version
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          elif [[ -n "$INPUT_VERSION" ]]; then
            if [[ ! "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "잘못된 버전 형식: $INPUT_VERSION" >&2
              exit 1
            fi
            VERSION="$INPUT_VERSION"
          else
            VERSION="$(grep '^version:' helm/afterglow/Chart.yaml | awk '{print $2}')"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Log in to GHCR (OCI)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | \
            helm registry login ghcr.io \
              --username "${{ github.actor }}" \
              --password-stdin

      - name: Package chart
        env:
          CHART_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          helm package helm/afterglow \
            --version "$CHART_VERSION" \
            --app-version "$CHART_VERSION"

      - name: Push to OCI registry
        env:
          CHART_VERSION: ${{ steps.ver.outputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          helm push "afterglow-${CHART_VERSION}.tgz" \
            "oci://ghcr.io/${OWNER}/charts"
          echo "✓ pushed: oci://ghcr.io/${OWNER}/charts/afterglow:${CHART_VERSION}"

      - name: Show install command
        env:
          CHART_VERSION: ${{ steps.ver.outputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          echo ""
          echo "배포 명령:"
          echo "  helm upgrade --install afterglow-dev \\"
          echo "    oci://ghcr.io/${OWNER}/charts/afterglow \\"
          echo "    --version ${CHART_VERSION} \\"
          echo "    -f values-dev.yaml -f secrets-dev.yaml \\"
          echo "    --namespace afterglow-dev --create-namespace"
