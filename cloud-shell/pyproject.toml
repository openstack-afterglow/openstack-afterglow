[project]
name = "afterglow-cloud-shell"
version = "1.23.0"
description = "Ephemeral Afterglow Cloud Shell runtime"
requires-python = ">=3.12"
dependencies = [
    "openstacksdk>=3.3,<5",
    "python-openstackclient>=7.4,<9",
    "python-barbicanclient>=7.0,<8",
    "python-designateclient>=6.2,<7",
    "python-heatclient>=4.0,<5",
    "python-magnumclient>=4.7,<5",
    "python-manilaclient>=5.4,<6",
    "python-octaviaclient>=3.10,<4",
    "python-swiftclient>=4.7,<5",
    "python-troveclient>=8.5,<9",
    "python-zunclient>=5.2,<6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0,<10",
    "ruff>=0.15,<0.16",
]

[tool.hatch.build.targets.wheel]
packages = ["src/afterglow_cloud_shell"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
