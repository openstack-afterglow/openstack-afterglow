global
    log stdout format raw local0 info
    maxconn 4096

# Docker's embedded DNS returns every replica address. Server templates retain
# their slots while replicas are added or removed.
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s
    hold nx 5s
    hold other 5s

# Every PEM in this read-only operator mount must contain a certificate chain
# followed by its matching unencrypted private key. An empty or invalid directory
# is intentionally a startup error rather than a self-signed TLS fallback.
# The directory permits a certificate set that covers catalog listener names.
defaults
    log global
    mode http
    option httplog
    option dontlognull
    option http-keep-alive
    timeout connect 5s
    timeout client 1h
    timeout server 1h
    timeout tunnel 1h
    timeout http-request 15s

frontend http_front
    bind *:80
    http-request redirect scheme https code 301

frontend https_front
    bind *:443 ssl crt /etc/haproxy/certs/ ssl-min-ver TLSv1.2 ciphers ECDHE+AESGCM:ECDHE+CHACHA20:DHE+AESGCM:DHE+CHACHA20 ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    option httplog

    # Overwrite externally supplied forwarding metadata at the trusted edge.
    http-request set-header X-Forwarded-For %[src]
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-Port 443
    http-request set-header X-Forwarded-Host %[req.hdr(host)]

    # Browser-facing API, AI API, OAuth/MCP discovery, and documentation remain
    # backend routes. All other paths are frontend assets/application routes.
    acl is_api path /api
    acl is_api path_beg /api/
    acl is_ai_v1 path_beg /v1/
    acl is_well_known path_beg /.well-known/
    acl is_docs path /docs /redoc /openapi.json
    use_backend afterglow_backend if is_api
    use_backend afterglow_backend if is_ai_v1
    use_backend afterglow_backend if is_well_known
    use_backend afterglow_backend if is_docs
    default_backend afterglow_frontend

    http-response set-header X-Content-Type-Options nosniff
    http-response set-header X-Frame-Options DENY
    http-response set-header Referrer-Policy strict-origin-when-cross-origin
    http-response set-header Permissions-Policy "camera=(), microphone=(), geolocation=()"
    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains"

# Optional sibling service catalog ingress. The listener is always available;
# a disabled Compose profile leaves its DNS server-template slots in maintenance
# and does not delay HAProxy startup. Keystone catalog public URLs should point
# to the matching HTTPS listener, never to an application container port.
frontend waygate_catalog_https
    bind *:8010 ssl crt /etc/haproxy/certs/ ssl-min-ver TLSv1.2
    http-request set-header X-Forwarded-For %[src]
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-Port 8010
    http-request set-header X-Forwarded-Host %[req.hdr(host)]
    default_backend waygate_backend

frontend drover_catalog_https
    bind *:8011 ssl crt /etc/haproxy/certs/ ssl-min-ver TLSv1.2
    http-request set-header X-Forwarded-For %[src]
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-Port 8011
    http-request set-header X-Forwarded-Host %[req.hdr(host)]
    default_backend drover_backend

frontend lumen_catalog_https
    bind *:8012 ssl crt /etc/haproxy/certs/ ssl-min-ver TLSv1.2
    http-request set-header X-Forwarded-For %[src]
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-Port 8012
    http-request set-header X-Forwarded-Host %[req.hdr(host)]
    default_backend lumen_backend

frontend palimpsest_catalog_https
    bind *:8020 ssl crt /etc/haproxy/certs/ ssl-min-ver TLSv1.2
    http-request set-header X-Forwarded-For %[src]
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-Port 8020
    http-request set-header X-Forwarded-Host %[req.hdr(host)]
    default_backend palimpsest_backend

backend afterglow_backend
    balance roundrobin
    option httpchk GET /api/v1/health
    http-check expect status 200
    server-template backend 1-10 backend:8000 check inter 10s resolvers docker init-addr last,libc,none

backend afterglow_frontend
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server-template frontend 1-10 frontend:3080 check inter 10s resolvers docker init-addr last,libc,none

backend waygate_backend
    balance roundrobin
    option httpchk GET /v1/health
    http-check expect status 200
    server-template waygate 1-10 waygate-api:8010 check inter 10s resolvers docker init-addr last,libc,none

backend drover_backend
    balance roundrobin
    option httpchk GET /v1/health/ready
    http-check expect status 200
    server-template drover 1-10 drover-api:8011 check inter 10s resolvers docker init-addr last,libc,none

backend lumen_backend
    balance roundrobin
    option httpchk GET /v1/health
    http-check expect status 200
    server-template lumen 1-10 lumen-api:8012 check inter 10s resolvers docker init-addr last,libc,none

backend palimpsest_backend
    balance roundrobin
    option httpchk GET /v1/health
    http-check expect status 200
    server-template palimpsest 1-10 palimpsest-api:8020 check inter 10s resolvers docker init-addr last,libc,none
