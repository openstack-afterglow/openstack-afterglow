# Install as a drop-in for the EXISTING observer unit, after reviewing its name.
# Add --flow-snapshot-file /run/afterglow-flow/snapshot.json to its existing
# ExecStart without removing its authenticated URL/host/token/allowlist options.
# This is read-only group access; the observer retains ZERO capabilities.
[Unit]
After=afterglow-flow-collector.service

[Service]
SupplementaryGroups=afterglow-flow-read
ReadOnlyPaths=-/run/afterglow-flow
